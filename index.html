<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 · 皮肤 3D 课堂</title>
<style>
:root{--pink:#eaa8b1;--ink:#f4ece8;--mute:#a8948f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 90% at 58% 42%,#2b181a 0%,#160d0e 55%,#0b0707 100%)}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.serif{font-family:"Songti SC","STSong","Noto Serif SC",serif}

header{position:fixed;left:32px;top:26px;pointer-events:none}
header .brand{letter-spacing:.34em;font-size:11px;color:var(--pink)}
header h1{font-size:30px;font-weight:600;margin-top:4px;letter-spacing:.06em}

nav{position:fixed;left:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 0;font-size:15px;color:var(--mute);transition:color .3s}
nav button i{width:16px;height:1px;background:currentColor;opacity:.5;transition:width .35s,background .35s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink)}
nav button.on i{width:34px;background:var(--pink);opacity:1}
nav button[disabled]{cursor:default;opacity:.32}
nav button small{font-size:10px;letter-spacing:.1em}

.card{position:fixed;right:32px;bottom:32px;width:min(360px,calc(100vw - 64px));padding:22px 24px;background:rgba(32,19,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(234,168,177,.16);border-radius:16px;transition:opacity .35s}
.card.fade{opacity:0}
.card h2{font-size:26px;font-weight:600;letter-spacing:.04em}
.row{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:12px}
.row span{color:var(--pink);font-size:12px;letter-spacing:.08em;padding-top:2px}
.row p{font-size:15px;line-height:1.55}
.meter{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--mute);display:flex;gap:22px;align-items:flex-end}
.meter b{display:block;font-size:22px;line-height:1.2;color:#9fd0ff;font-variant-numeric:tabular-nums;font-weight:600}
.meter .out b{color:#ffb4a8}
.meter em{font-style:normal;margin-left:auto;display:flex;align-items:center;gap:6px}
.meter em::before{content:'';width:7px;height:7px;border-radius:50%;background:#8cc8ff;box-shadow:0 0 6px #8cc8ff}

.tools{position:fixed;right:32px;top:26px;display:flex;gap:8px}
.tools button{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid rgba(234,168,177,.25);color:var(--mute);transition:all .3s}
.tools button.on,.tools button:hover{color:var(--ink);border-color:var(--pink)}

.foot{position:fixed;left:32px;bottom:22px;font-size:12px;color:#7a6663;pointer-events:none}

.lbl{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .3s;will-change:transform}
.lbl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);flex:none}
.lbl span{background:rgba(18,11,12,.62);padding:1px 8px;border-radius:6px}
body.nolabel .lbl{opacity:0!important}

@media (max-width:820px){
  header{left:18px;top:16px} header h1{font-size:21px}
  nav{top:auto;bottom:0;left:0;right:0;transform:none;flex-direction:row;overflow-x:auto;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(15,9,10,.75)}
  nav button{white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:14px}
  nav button i{display:none}
  nav button.on{background:rgba(234,168,177,.2)}
  .card{left:14px;right:14px;width:auto;bottom:66px;padding:14px 16px}
  .card h2{font-size:20px} .row{margin-top:6px} .row p{font-size:14px}
  .meter{margin-top:10px;padding-top:8px}
  .foot{display:none}
  .tools{right:14px;top:16px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header><div class="brand">HYMN · 赫眉</div><h1 class="serif">皮肤里面长什么样</h1></header>
<nav id="nav"></nav>
<div class="tools"><button id="bLabel" class="on">标注</button><button id="bReset">复位</button></div>
<div class="card" id="card">
  <h2 class="serif" id="cName"></h2>
  <div class="row"><span>看得到</span><p id="cSee"></p></div>
  <div class="row"><span>底下</span><p id="cUnder"></p></div>
  <div class="row"><span>护理</span><p id="cCare"></p></div>
  <div class="meter"><div>留在皮肤里<b id="mIn">0</b></div><div class="out">正往外跑<b id="mOut">0</b></div><em>水分子（示意）</em></div>
</div>
<div class="foot">示意图：各层厚度做了放大，不是真实比例 · 拖动旋转，双指缩放</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- 状态定义 ---------- */
const STATES = [
  {id:'healthy', name:'健康肌', ready:true,
   p:{dry:0, water:.94, lipid:1},
   cam:{pos:[12,8.5,15], tgt:[0,.6,0]},
   see:'有光泽，摸着软，不紧绷',
   under:'角质细胞像砖，细胞间脂质像水泥，砌得严严实实，把水锁在里面',
   care:'温和清洁、日常保湿、白天防晒，守住就好'},
  {id:'dry', name:'干燥缺水', ready:true,
   p:{dry:1, water:.38, lipid:.22},
   cam:{pos:[5.2,6.6,9.4], tgt:[.4,3.3,2.2]},
   see:'紧绷、起皮、上妆卡粉，细纹更明显',
   under:'“水泥”变少，砖翘起来、缝变大，水顺着缝往外跑',
   care:'补水的同时补“水泥”（如神经酰胺）；洗脸水别太烫，别过度清洁'},
  {id:'barrier', name:'屏障受损 · 敏感'},
  {id:'red', name:'泛红'},
  {id:'oily', name:'油性 · 毛孔粗大'},
  {id:'blackhead', name:'黑头'},
  {id:'acne', name:'闭口 → 痘痘'},
  {id:'mark', name:'痘印'},
  {id:'spot', name:'色斑 · 暗沉'},
  {id:'sunburn', name:'晒伤'},
  {id:'aging', name:'衰老 · 细纹'},
];

/* ---------- 基础 ---------- */
let seed = 7;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a,b) => a + (b-a)*rand();
const V = (x,y,z) => new THREE.Vector3(x,y,z);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .45;

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, .1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 4; controls.maxDistance = 40;
controls.autoRotate = true; controls.autoRotateSpeed = .35;

scene.add(new THREE.HemisphereLight(0xffe8e0, 0x2a1414, .8));
const key = new THREE.DirectionalLight(0xfff1ea, 2.2); key.position.set(6,12,8); scene.add(key);
const rim = new THREE.DirectionalLight(0xeaa8b1, 1.8); rim.position.set(-8,4,-10); scene.add(rim);
const low = new THREE.DirectionalLight(0xffc9b0, .5); low.position.set(4,-6,6); scene.add(low);

/* 皮肤块边界：x ±5，z ±4；四个侧面做“切开”效果 */
const W = 5, D = 4;
const clip = [new THREE.Plane(V(-1,0,0),W), new THREE.Plane(V(1,0,0),W), new THREE.Plane(V(0,0,-1),D), new THREE.Plane(V(0,0,1),D)];
const mat = o => new THREE.MeshStandardMaterial({roughness:.55, metalness:0, clippingPlanes:clip, side:THREE.DoubleSide, ...o});

/* 表皮—真皮交界（波浪状的“表皮突”） */
const ej = (x,z) => 2.55 + .22*Math.sin(x*1.7+.4)*Math.cos(z*1.5-.3);
const FOL = [{x:2.2, z:1.0, bot:-.9}, {x:-2.7, z:-1.9, bot:-.5}];
const nearF = (x,z,r) => FOL.some(f => Math.hypot(x-f.x, z-f.z) < r);
const dummy = new THREE.Object3D();
const col = new THREE.Color();

/* ---------- 角质层：砖 ---------- */
const bricks = [];
for (let row=0; row<4; row++) {
  const y = 3.64 + row*.1;
  for (let x=-5.5; x<=5.5; x+=.76) for (let zi=0, z=-4.5; z<=4.5; z+=.66, zi++) {
    const xx = x + (zi%2 ? .38 : 0) + (row%2 ? .25 : 0) + R(-.05,.05);
    const zz = z + (row%2 ? .3 : 0) + R(-.05,.05);
    if (nearF(xx,zz,.42)) continue;
    bricks.push({x:xx, y:y+R(-.012,.012), z:zz, row, ry:R(0,Math.PI), ta:R(0,Math.PI*2), r1:rand(), r2:rand(), r3:rand(), base:new THREE.Color().setHSL(.07+R(-.01,.01), .42, row===3 ? .74 : .68+R(-.03,.03))});
  }
}
const brickMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(.43,.43,.075,6,1), mat({roughness:.42}), bricks.length);
brickMesh.frustumCulled = false; scene.add(brickMesh);
const dullCol = new THREE.Color('#c9bfb8');
function updBricks(p) {
  bricks.forEach((b,i) => {
    const top = b.row === 3, d = p.dry;
    const s = 1 - .24*d*(.6 + .4*b.r1);
    const curl = d*(top ? .24 : b.row===2 ? .1 : .03)*b.r2;
    let rx = Math.cos(b.ta)*curl, rz = Math.sin(b.ta)*curl, y = b.y + (top ? d*.03*b.r2 : 0);
    if (top && b.r3 < .14) { y += d*(.12 + .38*b.r1); rx += Math.cos(b.ta)*d*.55; rz += Math.sin(b.ta)*d*.55; }
    dummy.position.set(b.x, y, b.z); dummy.rotation.set(rx, b.ry, rz); dummy.scale.set(s, 1 - .15*d, s);
    dummy.updateMatrix(); brickMesh.setMatrixAt(i, dummy.matrix);
    col.copy(b.base).lerp(dullCol, d*(top ? .55 : .3)); brickMesh.setColorAt(i, col);
  });
  brickMesh.instanceMatrix.needsUpdate = true; brickMesh.instanceColor.needsUpdate = true;
}
/* 砖缝里的“水泥”：细胞间脂质 */
const lipidMat = new THREE.MeshBasicMaterial({color:'#ffcf7a', transparent:true, opacity:.5, depthWrite:false});
const lipid = new THREE.Mesh(new THREE.BoxGeometry(2*W, .3, 2*D), lipidMat);
lipid.position.y = 3.75; scene.add(lipid);

/* ---------- 活表皮：细胞 ---------- */
const cells = [];
for (let x=-5.2; x<=5.2; x+=.3) for (let z=-4.2; z<=4.2; z+=.3) {
  const xx = x + R(-.05,.05), zz = z + R(-.05,.05);
  if (nearF(xx,zz,.36)) continue;
  const base = ej(xx,zz); let layer = 0;
  for (let y=base+.14; y<3.52; y+=.27, layer++) {
    const gran = y > 3.25, basal = layer === 0;
    const melano = basal && rand() < .045;
    cells.push({x:xx+R(-.03,.03), y, z:zz+R(-.03,.03), sx: gran ? 1.25 : 1, sy: basal ? 1.3 : gran ? .6 : .95, ry:R(0,6),
      c: melano ? new THREE.Color('#5a3122') : basal ? new THREE.Color().setHSL(.02,.42,.6) : gran ? new THREE.Color().setHSL(.06,.5,.74) : new THREE.Color().setHSL(.015,.55,.72+R(-.03,.03))});
  }
}
const cellMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.165,1), mat({roughness:.5}), cells.length);
cellMesh.frustumCulled = false; scene.add(cellMesh);
cells.forEach((c,i) => cellMesh.setColorAt(i, c.c));
function updCells(p) {
  const k = 1 - .1*p.dry;
  cells.forEach((c,i) => {
    dummy.position.set(c.x, c.y, c.z); dummy.rotation.set(0, c.ry, 0); dummy.scale.set(c.sx*k, c.sy*k, c.sx*k);
    dummy.updateMatrix(); cellMesh.setMatrixAt(i, dummy.matrix);
  });
  cellMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- 真皮：胶原、弹力纤维、毛细血管 ---------- */
function fiber(n, yMin, yMax, r0, r1, amp, len) {
  const geos = [];
  for (let i=0; i<n; i++) {
    const a = R(0,Math.PI*2), dir = V(Math.cos(a), R(-.12,.12), Math.sin(a));
    const perp = V(-dir.z, 0, dir.x), st = V(R(-W-1,W+1), R(yMin,yMax), R(-D-1,D+1));
    const pts = [], L = R(len*.6, len), ph = R(0,6);
    for (let k=0; k<=8; k++) {
      const p = st.clone().addScaledVector(dir, L*k/8).addScaledVector(perp, Math.sin(k*1.3+ph)*amp);
      p.y += Math.cos(k*1.7+ph)*amp*.6;
      p.y = Math.min(Math.max(p.y, yMin), Math.min(yMax, ej(p.x,p.z) - .12));
      for (const f of FOL) { const dx=p.x-f.x, dz=p.z-f.z, d=Math.hypot(dx,dz); if (d<.5) { p.x = f.x+dx/d*.5; p.z = f.z+dz/d*.5; } }
      pts.push(p);
    }
    geos.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, R(r0,r1), 6));
  }
  return mergeGeometries(geos);
}
scene.add(new THREE.Mesh(fiber(150, -1.3, 1.6, .07, .11, .25, 5), mat({color:'#f1dcd0', roughness:.6})));
scene.add(new THREE.Mesh(fiber(90, 1.6, 2.8, .03, .045, .15, 3), mat({color:'#f4d6cc', roughness:.6})));
scene.add(new THREE.Mesh(fiber(70, -1.3, 2.6, .018, .026, .4, 4), mat({color:'#e8c26a', emissive:'#3a2a00', roughness:.4})));

const vessels = [];
for (let x=-4.6; x<=4.6; x+=.9) for (let z=-3.6; z<=3.6; z+=.9) {
  const xx = x + R(-.2,.2), zz = z + R(-.2,.2), top = ej(xx,zz);
  if (top < 2.58 || nearF(xx,zz,.6)) continue;
  const w = .07;
  vessels.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(xx-w,1.3,zz), V(xx-w*.8,top-.25,zz), V(xx,top-.1,zz), V(xx+w*.8,top-.25,zz), V(xx+w,1.3,zz)]), 20, .035, 6));
}
for (const yy of [1.3, -1.15]) for (let i=0; i<10; i++) {
  const z0 = R(-D,D), pts = [];
  for (let k=0; k<=8; k++) pts.push(V(-W-1 + k*(2*W+2)/8, yy + R(-.12,.12), z0 + R(-.4,.4)));
  vessels.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, yy > 0 ? .05 : .08, 6));
}
scene.add(new THREE.Mesh(mergeGeometries(vessels), mat({color:'#b3242d', emissive:'#3a0306', roughness:.35})));

/* ---------- 皮下脂肪 ---------- */
const fats = [];
for (let x=-5.2; x<=5.2; x+=.9) for (let z=-4.2; z<=4.2; z+=.9) for (let y=-3.8; y<=-1.8; y+=.85)
  fats.push({x:x+R(-.12,.12), y:y+R(-.1,.1), z:z+R(-.12,.12), r:R(.4,.5)});
const fatMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1,18,12), mat({roughness:.3, emissive:'#2a1600'}), fats.length);
fats.forEach((f,i) => { dummy.position.set(f.x,f.y,f.z); dummy.rotation.set(0,0,0); dummy.scale.set(f.r, f.r*.9, f.r); dummy.updateMatrix(); fatMesh.setMatrixAt(i, dummy.matrix); fatMesh.setColorAt(i, col.setHSL(.12+R(-.01,.01), .75, .66+R(-.04,.04))); });
scene.add(fatMesh);

/* 真皮基质、脂肪层的半透明底色 */
const glass = (h, y, c, o) => { const m = new THREE.Mesh(new THREE.BoxGeometry(2*W, h, 2*D), new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:o, depthWrite:false})); m.position.y = y; scene.add(m); };
glass(3.95, .575, '#f0b9ae', .1);
glass(2.6, -2.75, '#f2d48a', .06);
scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2*W, 8.1, 2*D)).translate(0, -.05, 0), new THREE.LineBasicMaterial({color:'#eaa8b1', transparent:true, opacity:.18})));

/* ---------- 毛囊、皮脂腺、汗腺 ---------- */
const folMat = mat({color:'#d99a8c', roughness:.5});
const hairMat = mat({color:'#2b1a14', roughness:.35});
const glandMat = mat({color:'#f0cf7c', roughness:.35, emissive:'#2a1a00'});
const glands = [];
for (const f of FOL) {
  const prof = [[.05,f.bot-.25],[.2,f.bot-.2],[.38,f.bot],[.36,f.bot+.3],[.27,f.bot+.9],[.26,1],[.27,3],[.31,4.0]].map(([r,y]) => new THREE.Vector2(r,y));
  const fm = new THREE.Mesh(new THREE.LatheGeometry(prof, 28), folMat); fm.position.set(f.x,0,f.z); scene.add(fm);
  const hl = 5.3 - (f.bot-.1);
  const hair = new THREE.Mesh(new THREE.CylinderGeometry(.065,.08,hl,10), hairMat); hair.position.set(f.x, (5.3+f.bot-.1)/2, f.z); scene.add(hair);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.32,.05,8,28), folMat); ring.rotation.x = Math.PI/2; ring.position.set(f.x,4.0,f.z); scene.add(ring);
  const g = new THREE.Group(); g.position.set(f.x+.5, 1.9, f.z);
  for (let i=0; i<7; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(R(.2,.28),16,12), glandMat); s.position.set(R(-.15,.25), R(-.3,.3), R(-.25,.25)); g.add(s); }
  scene.add(g); glands.push(g);
}
{
  const c = V(-.6,-1.15,2.4), pts = [];
  for (let k=0; k<=60; k++) { const a = k/60*Math.PI*7; pts.push(V(c.x+Math.cos(a)*.3, c.y-.2+k/60*.4, c.z+Math.sin(a)*.3)); }
  for (let k=1; k<=14; k++) { const t = k/14, y = c.y+.2 + t*(4.0-c.y-.2); pts.push(V(c.x + (y>2.6 ? Math.cos(y*9)*.08 : Math.sin(k)*.05), y, c.z + (y>2.6 ? Math.sin(y*9)*.08 : 0))); }
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 220, .06, 6), mat({color:'#e6b9a8', roughness:.45})));
}

/* 底部柔光 */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(234,168,177,.35)'); gr.addColorStop(1,'rgba(234,168,177,0)'); g.fillStyle = gr; g.fillRect(0,0,128,128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(22,18), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.y = -4.2; scene.add(m);
}

/* ---------- 水分子 ---------- */
const NW = 750, wBase = [], wPos = new Float32Array(NW*3), wA = new Float32Array(NW), wS = new Float32Array(NW);
for (let i=0; i<NW; i++) {
  const x = R(-4.8,4.8), z = R(-3.8,3.8), inSC = rand() < .45;
  const y = inSC ? R(3.62,3.92) : R(ej(x,z)+.1, 3.5);
  wBase.push({x, y, z, r:rand(), ph:R(0,6), sp:R(.7,1.3), leak:false, t0:0, a:0});
  wS[i] = R(.09,.14);
}
const wGeo = new THREE.BufferGeometry();
wGeo.setAttribute('position', new THREE.BufferAttribute(wPos,3));
wGeo.setAttribute('aA', new THREE.BufferAttribute(wA,1));
wGeo.setAttribute('aS', new THREE.BufferAttribute(wS,1));
const water = new THREE.Points(wGeo, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aA; attribute float aS; uniform float uPR; varying float vA;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_PointSize = aS*uPR*900./-mv.z; gl_Position = projectionMatrix*mv; vA = aA; }`,
  fragmentShader:`varying float vA; void main(){ float d = length(gl_PointCoord-.5); float a = smoothstep(.5,.05,d)*vA; if(a<.01) discard; gl_FragColor = vec4(.5,.78,1.,a); }`
}));
water.frustumCulled = false; scene.add(water);
let nIn = 0, nOut = 0;
function updWater(t, p) {
  const leakFrac = 1 - p.water, speed = .05 + .1*p.dry;
  nIn = 0; nOut = 0;
  wBase.forEach((w,i) => {
    const leak = w.r < leakFrac;
    if (leak && !w.leak) w.t0 = t;
    w.leak = leak;
    let x = w.x, y = w.y, z = w.z, target;
    if (!leak) {
      x += Math.sin(t*1.3+w.ph)*.03; y += Math.cos(t*1.1+w.ph)*.02; target = .85;
    } else {
      const cyc = ((t - w.t0)*speed*w.sp) % 1;
      if (cyc < .6) {
        const k = cyc/.6; y = w.y + k*(5.6 - w.y); x += Math.sin(k*9+w.ph)*.08;
        target = y < 4 ? .85 : Math.max(0, 1 - (y-4)/1.4)*.85;
      } else target = 0;
    }
    w.a += (target - w.a)*.12;
    wPos[i*3] = x; wPos[i*3+1] = y; wPos[i*3+2] = z; wA[i] = w.a;
    if (w.a > .2) { if (!leak) nIn++; else nOut++; }
  });
  wGeo.attributes.position.needsUpdate = true; wGeo.attributes.aA.needsUpdate = true;
}

/* ---------- 标注 ---------- */
const LABELS = [
  ['角质层', [-W,3.8,D]], ['表皮', [-W,3.0,D]], ['真皮', [-W,.6,D]], ['皮下脂肪', [-W,-2.8,D]],
  ['毛囊', [FOL[0].x+.3,.2,FOL[0].z]], ['皮脂腺', [FOL[0].x+.8,1.9,FOL[0].z]], ['汗腺', [-.3,-1.15,2.4]], ['毛细血管', [-W,1.3,1.5]],
].map(([t,p]) => { const el = document.createElement('div'); el.className = 'lbl'; el.innerHTML = `<span>${t}</span>`; document.body.appendChild(el); return {el, v:V(...p)}; });
const tmp = new THREE.Vector3();
function updLabels() {
  for (const L of LABELS) {
    tmp.copy(L.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    L.el.style.opacity = vis ? 1 : 0;
    L.el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth - 3}px, ${(-tmp.y*.5+.5)*innerHeight - 9}px)`;
  }
}

/* ---------- 状态切换 ---------- */
const cur = {...STATES[0].p}, goal = {...STATES[0].p};
let active = STATES[0], camTween = null;
const nav = document.getElementById('nav');
STATES.forEach(s => {
  const b = document.createElement('button');
  b.innerHTML = `<i></i>${s.name}${s.ready ? '' : ' <small>待做</small>'}`;
  if (!s.ready) b.disabled = true;
  b.onclick = () => select(s);
  s.btn = b; nav.appendChild(b);
});
const card = document.getElementById('card');
function fitCam(c) {
  const k = camera.aspect < 1 ? 1.7 : camera.aspect < 1.3 ? 1.25 : 1;
  const tg = V(...c.tgt), pos = V(...c.pos);
  return {pos: tg.clone().add(pos.sub(tg).multiplyScalar(k)), tgt: tg};
}
function select(s, instant) {
  active = s; Object.assign(goal, s.p);
  STATES.forEach(x => x.btn.classList.toggle('on', x === s));
  localStorage.setItem('hymnSkin.state', s.id);
  card.classList.add('fade');
  setTimeout(() => {
    document.getElementById('cName').textContent = s.name;
    document.getElementById('cSee').textContent = s.see;
    document.getElementById('cUnder').textContent = s.under;
    document.getElementById('cCare').textContent = s.care;
    card.classList.remove('fade');
  }, instant ? 0 : 280);
  const c = fitCam(s.cam);
  if (instant) { camera.position.copy(c.pos); controls.target.copy(c.tgt); camTween = null; }
  else camTween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:c.pos, t1:c.tgt};
}
controls.addEventListener('start', () => { camTween = null; controls.autoRotate = false; });
document.getElementById('bReset').onclick = () => select(active);
const bLabel = document.getElementById('bLabel');
const setLabel = on => { bLabel.classList.toggle('on', on); document.body.classList.toggle('nolabel', !on); localStorage.setItem('hymnSkin.label', on ? '1' : '0'); };
bLabel.onclick = () => setLabel(!bLabel.classList.contains('on'));
setLabel(localStorage.getItem('hymnSkin.label') !== '0');

const saved = STATES.find(s => s.id === localStorage.getItem('hymnSkin.state') && s.ready) || STATES[0];
Object.assign(cur, saved.p);
select(saved, true);
updBricks(cur); updCells(cur);
lipidMat.opacity = .5*cur.lipid;

/* ---------- 循环 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
let lastMeter = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  let moved = false;
  for (const k in goal) { const d = goal[k] - cur[k]; if (Math.abs(d) > 1e-4) { cur[k] += d*Math.min(1, dt*1.8); moved = true; } }
  if (moved) { updBricks(cur); updCells(cur); lipidMat.opacity = .5*cur.lipid; }
  updWater(t, cur);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt/1.8); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updLabels();
  if (t - lastMeter > .25) { lastMeter = t; document.getElementById('mIn').textContent = nIn; document.getElementById('mOut').textContent = nOut; }
});
</script>
</body>
</html>
