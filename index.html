<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 · 皮肤 3D 课堂</title>
<style>
:root{--pink:#eaa8b1;--deep:#c46f7d;--ink:#3b2a2b;--mute:#9a8584}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#f1e8e5}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.serif{font-family:"Songti SC","STSong","Noto Serif SC",serif}

header{position:fixed;left:32px;top:26px;pointer-events:none;z-index:2}
header .brand{letter-spacing:.34em;font-size:11px;color:var(--deep)}
header h1{font-size:30px;font-weight:600;margin-top:4px;letter-spacing:.06em}

nav{z-index:2;position:fixed;left:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 0;font-size:15px;color:var(--mute);transition:color .3s}
nav button i{width:16px;height:1px;background:currentColor;opacity:.5;transition:width .35s,background .35s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on i{width:34px;height:2px;background:var(--pink);opacity:1}
nav button[disabled]{cursor:default;opacity:.4}
nav button small{font-size:10px;letter-spacing:.1em}

.card{z-index:2;position:fixed;right:32px;bottom:32px;width:min(360px,calc(100vw - 64px));padding:22px 24px;background:rgba(255,255,255,.6);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px -20px rgba(120,70,75,.3);border-radius:18px;transition:opacity .35s}
.card.fade{opacity:0}
.card h2{font-size:26px;font-weight:600;letter-spacing:.04em}
.row{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:12px}
.row span{color:var(--deep);font-size:12px;letter-spacing:.08em;padding-top:2px}
.row p{font-size:15px;line-height:1.55}
.meter{margin-top:16px;padding-top:12px;border-top:1px solid rgba(160,110,115,.15);font-size:12px;color:var(--mute);display:flex;gap:22px;align-items:flex-end}
.meter b{display:block;font-size:22px;line-height:1.2;color:#4a8fcf;font-variant-numeric:tabular-nums;font-weight:600}
.meter em{font-style:normal;margin-left:auto;display:flex;align-items:center;gap:6px}
.meter em::before{content:'';width:8px;height:8px;border-radius:50%;background:#9cc8ef}

.tools{z-index:2;position:fixed;right:32px;top:26px;display:flex;gap:8px}
.tools button{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);color:var(--mute);transition:all .3s}
.tools button.on,.tools button:hover{color:var(--ink);border-color:var(--pink)}

.foot{position:fixed;left:32px;bottom:22px;font-size:12px;color:#a8908e;pointer-events:none}

.lbl{z-index:1;position:fixed;left:0;top:0;pointer-events:none;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .3s;will-change:transform}
.lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--pink),0 1px 4px rgba(0,0,0,.25);flex:none}
.lbl span{background:rgba(255,255,255,.82);padding:1px 9px;border-radius:99px;color:var(--ink);box-shadow:0 2px 8px rgba(80,40,40,.12)}
body.nolabel .lbl{opacity:0!important}

@media (max-width:820px){
  header{left:18px;top:16px} header h1{font-size:21px}
  nav{top:auto;bottom:0;left:0;right:0;transform:none;flex-direction:row;overflow-x:auto;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  nav button{white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:14px}
  nav button i{display:none}
  nav button.on{background:rgba(234,168,177,.35)}
  .card{left:14px;right:14px;width:auto;bottom:66px;padding:14px 16px}
  .card h2{font-size:20px} .row{margin-top:6px} .row p{font-size:14px}
  .meter{margin-top:10px;padding-top:8px}
  .foot{display:none}
  .tools{right:14px;top:16px}
}
</style>
<script type="importmap">

  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';

/* ---------- 状态定义 ---------- */
const STATES = [
  {id:'healthy', name:'健康肌', ready:true,
   p:{dry:0, leak:.06},
   cam:{pos:[12.5,8.6,15.5], tgt:[0,.3,0]},
   see:'有光泽，摸着软，不紧绷',
   under:'角质层薄而整齐，细胞间脂质把缝填满，水被锁在里面',

  {id:'dry', name:'干燥缺水', ready:true,

   cam:{pos:[9.8,8.4,13.8], tgt:[1.3,2.3,1.2]},
   see:'紧绷、起皮、上妆卡粉，细纹更明显',
   under:'细胞间脂质变少，角质翘起、皮纹变深，水从表面加速跑掉',
   care:'补水的同时补脂质（如神经酰胺）；洗脸水别太烫，别过度清洁'},
  {id:'barrier', name:'屏障受损 · 敏感'},
  {id:'red', name:'泛红'},
  {id:'oily', name:'油性 · 毛孔粗大'},
  {id:'blackhead', name:'黑头'},
  {id:'acne', name:'闭口 → 痘痘'},
  {id:'mark', name:'痘印'},
  {id:'spot', name:'色斑 · 暗沉'},
  {id:'sunburn', name:'晒伤'},
  {id:'aging', name:'衰老 · 细纹'},
];

/* ---------- 基础 ---------- */
let seed = 11;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a,b) => a + (b-a)*rand();
const V = (x,y,z) => new THREE.Vector3(x,y,z);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .32;
{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
  const g = cv.getContext('2d');
  const lg = g.createLinearGradient(0,0,0,1024); lg.addColorStop(0,'#f8f2f0'); lg.addColorStop(1,'#e8dcd8');
  g.fillStyle = lg; g.fillRect(0,0,1024,1024);
  const rg = g.createRadialGradient(580,430,0,580,430,560); rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0,0,1024,1024);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(33, innerWidth/innerHeight, .1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 3; controls.maxDistance = 40;
controls.autoRotate = true; controls.autoRotateSpeed = .3;

scene.add(new THREE.HemisphereLight(0xfff6f2, 0x8a6a66, .7));
const key = new THREE.DirectionalLight(0xfff0e4, 2.1); key.position.set(-4,10,8); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe6e0, .9); fill.position.set(9,3,6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(2,6,-10); scene.add(rim);

/* ---------- 尺寸与层界（JS 与着色器共用同一套公式） ---------- */
const W = 5, D = 4, TOP = 3.9, BOT = -3.5;
const surfY = (x,z) => TOP + .1*Math.sin(x*.8+.3)*Math.cos(z*.9-.5) + .05*Math.sin(x*1.9-z*1.3+1.);   // 皮肤表面起伏
const ejY = (x,z) => surfY(x,z) - .52 + .09*(Math.sin(x*3.3+.4) + Math.sin(z*3.1-.2));     // 表皮/真皮交界
const dbY = (x,z) => .45 + .18*Math.sin(x*1.1+.3) + .14*Math.cos(z*1.3);       // 真皮/脂肪交界
const fxY = y => -2 + (y-.7)*.18;                                               // 切面上那根毛囊的中心线
const U = {dry:{value:0}, fol:{value:[]}};

/* ---------- 皮肤块：程序化组织纹理 ---------- */
const NOISE = /* glsl */`
uniform float uDry;
uniform vec2 uFol[8];
varying vec3 vWPos; varying vec3 vWN;
float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
vec3 voro(vec3 p){vec3 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(x,y,z);vec3 r=g+h33(i+g)-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=h13(i+g+.5);}else if(d<d2)d2=d;}
 d1=sqrt(d1);d2=sqrt(d2);return vec3(d1,d2-d1,id);}
vec3 voro2(vec2 p){vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++){vec2 g=vec2(x,y);vec2 r=g+h33(vec3(i+g,7.)).xy-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=h13(vec3(i+g,3.));}else if(d<d2)d2=d;}
 d1=sqrt(d1);d2=sqrt(d2);return vec3(d1,d2-d1,id);}
float surfY(vec2 q){return 3.9+.1*sin(q.x*.8+.3)*cos(q.y*.9-.5)+.05*sin(q.x*1.9-q.y*1.3+1.);}
/* 表面真实下凹：皮纹沟 + 毛孔（几何位移，边缘渐隐以免和切面错位） */
float topDisp(vec2 q,float d){
  vec3 v1=voro2(q*1.5); float cr1=1.-smoothstep(0.,.08+.03*d,v1.y);
  vec3 v2=voro2(q*4.2+3.1); float cr2=1.-smoothstep(0.,.05,v2.y);
  float pore=0.; for(int i=0;i<8;i++){pore=max(pore,1.-smoothstep(.035,.1,length(q-uFol[i])));}
  float fade=smoothstep(0.,.18,min(5.-abs(q.x),4.-abs(q.y)));
  return fade*(-cr1*(.035+.03*d)-cr2*(.01+.008*d)-pore*.04+fbm(vec3(q*1.6,9.))*.04);
}
`;
const GLSL = /* glsl */`
vec3 L(vec3 c){return pow(c,vec3(2.2));}
float ejY(vec2 q){return surfY(q)-.52+.09*(sin(q.x*3.3+.4)+sin(q.y*3.1-.2));}
float dbY(vec2 q){return .45+.18*sin(q.x*1.1+.3)+.14*cos(q.y*1.3);}
float segD(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}

/* 表面：皮纹、毛孔、干燥时翘起的皮屑 */
void topSkin(vec3 p,out vec3 c,out float H,out float r,out float s){
  vec2 q=p.xz; float d=uDry;
  vec3 v1=voro2(q*1.5); float cr1=1.-smoothstep(0.,.07+.03*d,v1.y);
  vec3 v2=voro2(q*4.2+3.1); float cr2=1.-smoothstep(0.,.05,v2.y);
  float n=fbm(vec3(q*6.,1.)), n2=fbm(vec3(q*1.1,4.));
  float pore=0.;
  for(int i=0;i<8;i++){float dd=length(q-uFol[i]);pore=max(pore,1.-smoothstep(.035,.1,dd));}
  vec3 vp=voro2(q*2.4+11.); pore=max(pore,step(.6,vp.z)*(1.-smoothstep(.0,.04,vp.x))*.7);
  vec3 vf=voro2(q*3.+5.); float flake=step(.42,vf.z); float rim=flake*(1.-smoothstep(0.,.08,vf.y));
  H=-cr1*(.02+.025*d)-cr2*(.006+.008*d)-pore*.03+n*.007+d*(flake*.012+rim*.01);
  vec3 base=mix(L(vec3(.87,.60,.49)),L(vec3(.82,.52,.44)),smoothstep(.35,.65,n2));
  base*=.95+.1*n;
  base=mix(base,base*vec3(.72,.6,.58),cr1*.7+cr2*.3);
  base=mix(base,L(vec3(.55,.36,.31)),pore*.5);
  vec3 dc=mix(base,L(vec3(.80,.62,.55)),.35);
  dc=mix(dc,L(vec3(.95,.88,.82)),rim*.75+flake*.12+cr1*.3+cr2*.15);
  c=mix(base,dc,d);
  r=mix(.4+cr1*.15,.8,d); s=1.;
}
/* 切面：角质层 / 表皮 / 真皮 / 皮下脂肪 */
void cutFace(vec3 p,vec3 nw,out vec3 c,out float H,out float r,out float s){
  vec2 q=p.xz; float d=uDry;
  float ej=ejY(q), db=dbY(q)+(fbm(p*1.3)-.5)*.35;
  float sy=surfY(q); float scT=sy-(.045+.08*d);
  H=0.; r=.55; s=0.;
  if(p.y>scT){
    float lam=sin(p.y*110.+fbm(p*10.)*4.)*.5+.5;
    c=mix(L(vec3(.92,.76,.64)),L(vec3(.85,.68,.57)),lam*.35);
    vec3 vc=voro(vec3(p.x*7.,p.y*1.5,p.z*7.));
    float crack=d*(1.-smoothstep(0.,.06,vc.y));
    c=mix(c,L(vec3(.70,.56,.50)),crack*.7);
    H=lam*.003-crack*.012; r=mix(.45,.8,d); s=.5;
  } else if(p.y>ej){
    float t=clamp((p.y-ej)/(scT-ej),0.,1.);
    vec3 v=voro(p*vec3(15.,15.+t*18.,15.));
    vec3 cc=mix(L(vec3(.80,.46,.40)),L(vec3(.86,.58,.48)),t);
    cc*=.93+.1*v.z;
    cc=mix(cc,L(vec3(.92,.74,.66)),(1.-smoothstep(0.,.09,v.y))*.4);
    cc=mix(cc,L(vec3(.60,.38,.42)),(1.-smoothstep(.12,.2,v.x))*.4*(1.-t*.8));
    float basal=1.-smoothstep(.0,.07,p.y-ej);
    cc=mix(cc,L(vec3(.58,.37,.28)),basal*.6*(.6+.4*v.z));
    c=mix(cc,cc*.97+.02,d*.5);
    H=(1.-v.x)*.007+(1.-smoothstep(0.,.09,v.y))*.003; r=.5; s=1.;
  } else if(p.y>db){
    float pap=smoothstep(ej-.45,ej-.2,p.y);
    float wv=fbm(vec3(p.x*1.2,p.y*3.,p.z*1.2))*14.;
    float fib=sin(p.y*46.+wv+sin((p.x+p.z)*9.)*.8)*.5+.5;
    float f=fbm(vec3(p.x*1.6,p.y*7.,p.z*1.6)+fbm(p*2.)*2.);
    float bundle=smoothstep(.38,.62,f)*.6+fib*.4*smoothstep(.3,.6,f);
    vec3 ret=mix(L(vec3(.82,.47,.45)),L(vec3(.94,.72,.67)),bundle);
    float f2=fbm(vec3(p.x*7.,p.y*22.,p.z*7.));
    vec3 papC=mix(L(vec3(.88,.55,.52)),L(vec3(.95,.74,.70)),smoothstep(.4,.6,f2));
    c=mix(ret,papC,pap);
    float el=1.-smoothstep(0.,.02,abs(fbm(p*vec3(2.,6.,2.)+7.)-.5));
    c=mix(c,L(vec3(.95,.82,.55)),el*.5*(1.-pap));
    H=bundle*.014*(1.-pap)+f2*.004*pap; r=.55; s=.6;
  } else {
    vec2 fuv=abs(nw.z)>.5?p.xy:abs(nw.x)>.5?p.zy:p.xz;
    vec3 lob=voro2(fuv*.95);
    float septa=1.-smoothstep(.02,.06,lob.y);
    vec3 cell=voro2(fuv*3.4+lob.z*10.);
    float ce=1.-smoothstep(.0,.05,cell.y);
    float dome=1.-smoothstep(.0,.75,cell.x); dome=sqrt(max(dome,0.));
    vec3 fatC=mix(L(vec3(.93,.70,.30)),L(vec3(1.,.90,.58)),dome*.8+cell.z*.2);
    fatC=mix(fatC,L(vec3(.80,.56,.30)),ce*.55);
    c=mix(fatC,L(vec3(.90,.68,.62)),septa);
    c=mix(c,L(vec3(.92,.70,.64)),(1.-smoothstep(0.,.12,db-p.y))*.5);
    H=dome*.05*(1.-septa)-septa*.02; r=mix(.22,.5,septa); s=.3;
  }
  /* 正面切面上：毛囊、皮脂腺、立毛肌 */
  if(nw.z>.5 && p.y>.6 && p.y<sy){
    float fx=-2.+(p.y-.7)*.18, dx=p.x-fx;
    float bulb=smoothstep(1.15,.8,p.y);
    float rr=.15+.1*bulb+.07*smoothstep(sy-.45,sy,p.y);
    if(abs(dx)<rr){
      float u=dx/rr;
      vec3 fc=mix(L(vec3(.89,.64,.58)),L(vec3(.97,.86,.78)),smoothstep(.85,.45,abs(u)));
      float shaft=(1.-smoothstep(.035,.05,abs(dx)))*step(.78,p.y);
      fc=mix(fc,L(vec3(.22,.13,.09)),shaft);
      float dp=length(vec2(dx,p.y-.7)/vec2(.08,.11));
      fc=mix(fc,L(vec3(.86,.50,.50)),1.-smoothstep(.8,1.,dp));
      c=mix(c,fc,smoothstep(1.,.9,abs(u)));
      H+=(1.-u*u)*.03+shaft*.012; s=.8;
    }
    vec2 sg=vec2(-2.+(2.85-.7)*.18+.38,2.85);
    float gd=length((p.xy-sg)/vec2(.24,.32));
    if(gd<1.){
      vec3 v=voro(vec3(p.xy*10.,.5));
      vec3 gc=mix(L(vec3(.99,.92,.74)),L(vec3(.92,.76,.48)),(1.-smoothstep(0.,.08,v.y))*.7+v.x*.3);
      float m=smoothstep(1.,.85,gd); c=mix(c,gc,m); H+=m*((1.-v.x)*.02+.015); s=.6;
    }
    vec2 a=vec2(-2.+(2.25-.7)*.18+.16,2.25), b=vec2(a.x+.85,ejY(vec2(a.x+.85,p.z))-.05);
    float ad=segD(p.xy,a,b);
    if(ad<.05){float m=smoothstep(.05,.03,ad);c=mix(c,L(vec3(.80,.44,.44))*(.9+.1*sin(dot(p.xy,vec2(70.,-25.)))),m);H+=m*.012;}
  }
}
void skinSample(vec3 p,vec3 nw,out vec3 c,out float H,out float r,out float s){
  if(nw.y>.5) topSkin(p,c,H,r,s); else cutFace(p,nw,c,H,r,s);
}
vec3 skinBump(vec3 sp,vec3 n,float H,float fd){
  vec3 sx=dFdx(sp), sy=dFdy(sp);
  vec3 r1=cross(sy,n), r2=cross(n,sx);
  float det=dot(sx,r1)*fd;
  vec2 dB=vec2(dFdx(H),dFdy(H));
  vec3 g=sign(det)*(dB.x*r1+dB.y*r2);
  return normalize(abs(det)*n-g);
}
`;
const skinMat = new THREE.MeshPhysicalMaterial({roughness:.5, sheen:.25, sheenRoughness:.6, sheenColor:new THREE.Color('#ffb2a0'), specularIntensity:.55});
skinMat.onBeforeCompile = sh => {
  sh.uniforms.uDry = U.dry; sh.uniforms.uFol = U.fol;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n' + NOISE)
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nif(normal.y>.5) transformed.y += topDisp(transformed.xz, uDry);\nvWPos=(modelMatrix*vec4(transformed,1.)).xyz; vWN=normalize(mat3(modelMatrix)*normal);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\n' + NOISE + GLSL)
    .replace('#include <color_fragment>', '#include <color_fragment>\nvec3 sCol; float sH, sR, sS; skinSample(vWPos, normalize(vWN), sCol, sH, sR, sS); diffuseColor.rgb = sCol;')
    .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = sR;')
    .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\nnormal = skinBump(-vViewPosition, normal, sH, faceDirection);')
    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += sCol*vec3(.07,.022,.015)*sS;');
};
const blockGeo = new THREE.BoxGeometry(2*W, TOP-BOT, 2*D, 320, 1, 256);
blockGeo.translate(0, (TOP+BOT)/2, 0);
{ const p = blockGeo.attributes.position; for (let i=0; i<p.count; i++) if (p.getY(i) > TOP-1e-4) p.setY(i, surfY(p.getX(i), p.getZ(i))); }
const block = new THREE.Mesh(blockGeo, skinMat); scene.add(block);

/* ---------- 汗毛（表面）+ 毛孔位置给着色器 ---------- */
const hairMat = new THREE.MeshPhysicalMaterial({color:'#3a2419', roughness:.35, sheen:.4, sheenColor:new THREE.Color('#8a6a50')});
function hair(x, z, len, yaw, tilt) {
  const g = new THREE.CylinderGeometry(.012, .03, len, 8, 10); g.translate(0, len/2, 0);
  const p = g.attributes.position;
  for (let i=0; i<p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) + .18*(y/len)**2*len); }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, hairMat); m.position.set(x, surfY(x,z)-.06, z); m.rotation.set(0, yaw, -tilt); scene.add(m);
}
const fol = [];
for (let i=0; i<8; i++) {
  let x, z; do { x = R(-4.2,4.2); z = R(-3.2,3.2); } while (fol.some(f => f.distanceTo(new THREE.Vector2(x,z)) < 1.6));
  fol.push(new THREE.Vector2(x,z)); hair(x, z, R(1.1,1.8), R(0,6.28), R(.5,.8));
}
U.fol.value = fol;
// 切面那根毛囊伸出表面的部分
hair(fxY(4), D-.06, 1.6, 0, .18);

/* ---------- 切面上的血管、汗腺（略凸出切面，像解剖标本） ---------- */
const artMat = new THREE.MeshPhysicalMaterial({color:'#a0262c', roughness:.32, clearcoat:.5, clearcoatRoughness:.3});
const veinMat = new THREE.MeshPhysicalMaterial({color:'#3f4d8c', roughness:.32, clearcoat:.5, clearcoatRoughness:.3});
const capMat = new THREE.MeshPhysicalMaterial({color:'#c8333b', roughness:.35});
const ductMat = new THREE.MeshPhysicalMaterial({color:'#f2cfc4', roughness:.4, sheen:.5, sheenColor:new THREE.Color('#ffd0c0')});
const tube = (pts, r, m) => scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.max(24, pts.length*6), r, 10), m));
// face: 'f' = 正面 z=D，沿 x；'r' = 右面 x=W，沿 z
const onFace = (f, h, y, inset=.025) => f === 'f' ? V(h, y, D - inset) : V(W - inset, y, h);
const ej2 = (f,h) => f === 'f' ? ejY(h, D) : ejY(W, h);
const db2 = (f,h) => f === 'f' ? dbY(h, D) : dbY(W, h);
const folX = fxY(3.2);
for (const f of ['f','r']) {
  const span = f === 'f' ? W : D;
  const skip = h => f === 'f' && Math.abs(h - folX) < .55;
  const skipDeep = h => f === 'f' && Math.abs(h - fxY(.9)) < .35;
  const run = (fn, r, m, sk) => {
    let seg = [];
    for (let h=-span+.02; h<=span-.02+1e-6; h+=.2) {
      if (sk(h)) { if (seg.length > 2) tube(seg, r, m); seg = []; continue; }
      seg.push(onFace(f, h, fn(h)));
    }
    if (seg.length > 2) tube(seg, r, m);
  };
  // 深层血管网（真皮底部）：动脉 + 静脉
  run(h => db2(f,h) + .17 + .04*Math.sin(h*4), .065, artMat, () => false);
  run(h => db2(f,h) + .02 + .04*Math.cos(h*3.5), .075, veinMat, () => false);
  // 浅层血管网
  const up = h => ej2(f,h) - .55 + .03*Math.sin(h*5);
  run(up, .035, artMat, skip);
  run(h => up(h) - .14, .04, veinMat, skip);
  // 上下连接
  for (const h of (f === 'f' ? [-4.1, -.5, 2.6, 4.3] : [-3.1, -.6, 2.2])) {
    tube([onFace(f,h,db2(f,h)+.17), onFace(f,h+.1,(db2(f,h)+up(h))/2), onFace(f,h+.15,up(h+.15))], .03, artMat);
  }
  // 毛细血管袢：伸进每个真皮乳头
  const k0 = Math.ceil((-span*3.3 - (f === 'f' ? .4 : -.2) - Math.PI/2) / (2*Math.PI));
  for (let k=k0; ; k++) {
    const h = (Math.PI/2 - (f === 'f' ? .4 : -.2) + 2*Math.PI*k) / (f === 'f' ? 3.3 : 3.1);
    if (h > span - .2) break; if (h < -span + .2 || skip(h)) continue;
    const top = ej2(f,h);
    tube([onFace(f,h-.07,up(h)), onFace(f,h-.05,top-.16), onFace(f,h,top-.07), onFace(f,h+.05,top-.16), onFace(f,h+.07,up(h)-.14)], .022, capMat);
  }
}
// 脂肪层里被切断的血管（露出管腔）
for (const [f,h,y] of [['f',-3.3,-1.4],['f',.7,-2.5],['f',3.4,-1.0],['r',-1.6,-1.9],['r',2.1,-.8]]) {
  for (const [dh, r, m, lum] of [[0,.065,artMat,'#5a0f12'],[.19,.08,veinMat,'#1b2244']]) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .16, 20), m);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(r*.55, 20), new THREE.MeshStandardMaterial({color:lum, roughness:.6}));
    if (f === 'f') { c.rotation.x = Math.PI/2; c.position.set(h+dh, y, D+.03); disc.position.set(h+dh, y, D+.111); }
    else { c.rotation.z = Math.PI/2; c.position.set(W+.03, y, h+dh); disc.position.set(W+.111, y, h+dh); disc.rotation.y = Math.PI/2; }
    scene.add(c, disc);
  }
}
// 汗腺：真皮底部一团盘绕的小管 + 一路通到表面的导管
const SW = {x:.9, y:dbY(.9, D) + .42};
{
  const pts = [];
  for (let k=0; k<=80; k++) { const a = k*.5; pts.push(V(SW.x + .2*Math.cos(a) + .07*Math.sin(a*.37), SW.y + .13*Math.sin(a*1.3) + .05*Math.cos(a*.7), D - .02)); }
  tube(pts, .035, ductMat);
  const duct = [];
  const ej0 = ejY(SW.x, D);
  for (let y=SW.y+.15, top=surfY(SW.x,D); y<=top+.001; y+=.04) duct.push(V(SW.x + (y < ej0 ? .05*Math.sin(y*5) : .05*Math.sin(y*5) + .045*Math.sin((y-ej0)*45)), y, D - .02));
  tube(duct, .026, ductMat);
}

/* 底部柔影 */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(90,50,50,.35)'); gr.addColorStop(.55,'rgba(90,50,50,.12)'); gr.addColorStop(1,'rgba(90,50,50,0)'); g.fillStyle = gr; g.fillRect(0,0,128,128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(17,14), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.y = BOT - .02; scene.add(m);
}

/* ---------- 干燥：翘起的皮屑 ---------- */
const flakeGeo = new THREE.CircleGeometry(.5, 14, 0, Math.PI*2); flakeGeo.scale(1,.75,1); flakeGeo.rotateX(-Math.PI/2);
{ const p = flakeGeo.attributes.position; for (let i=0; i<p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, .28*x*x + .12*z*z); } flakeGeo.computeVertexNormals(); }
const flakes = [];
for (let i=0; i<220; i++) flakes.push({x:R(-W+.3,W-.3), z:R(-D+.3,D-.3), s:R(.12,.3), ry:R(0,6.28), tilt:R(.08,.45), lift:R(0,.05)});
const flakeMesh = new THREE.InstancedMesh(flakeGeo, new THREE.MeshPhysicalMaterial({color:'#e9cfc2', roughness:.75, side:THREE.DoubleSide, transparent:true, opacity:.85, sheen:.6, sheenColor:new THREE.Color('#fff4ee')}), flakes.length);
flakeMesh.frustumCulled = false; scene.add(flakeMesh);
const dummy = new THREE.Object3D();
function updFlakes(d) {
  flakes.forEach((f,i) => {
    const s = f.s * Math.min(1, d*1.3);
    dummy.position.set(f.x, surfY(f.x,f.z) + .004 + f.lift*d, f.z); dummy.rotation.set(f.tilt*d, f.ry, 0); dummy.scale.set(s, s, s*.8);
    dummy.updateMatrix(); flakeMesh.setMatrixAt(i, dummy.matrix);
  });
  flakeMesh.instanceMatrix.needsUpdate = true; flakeMesh.visible = d > .01;
}

/* ---------- 水汽：从表面往外跑 ---------- */
const NV = 320, vap = [], vPos = new Float32Array(NV*3), vA = new Float32Array(NV), vS = new Float32Array(NV);
for (let i=0; i<NV; i++) { vap.push({x:R(-W+.3,W-.3), z:R(-D+.3,D-.3), r:rand(), r2:rand(), ph:R(0,6), sp:R(.7,1.3), leak:false, t0:0, a:0}); vS[i] = R(.05,.09); }
const vGeo = new THREE.BufferGeometry();
vGeo.setAttribute('position', new THREE.BufferAttribute(vPos,3));
vGeo.setAttribute('aA', new THREE.BufferAttribute(vA,1));
vGeo.setAttribute('aS', new THREE.BufferAttribute(vS,1));
scene.add(Object.assign(new THREE.Points(vGeo, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aA; attribute float aS; uniform float uPR; varying float vA;
    void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aS*uPR*900./-mv.z; gl_Position=projectionMatrix*mv; vA=aA; }`,
  fragmentShader:`varying float vA; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.1,d)*vA; if(a<.01) discard; gl_FragColor=vec4(.55,.76,.95,a*.75); }`
})), {frustumCulled:false}));
let nOut = 0, firstVap = true;
function updVapor(t, p) {
  const speed = .12 + .1*p.dry; nOut = 0;
  vap.forEach((w,i) => {
    const leak = w.r < p.leak;
    if (leak && !w.leak) w.t0 = firstVap ? t - w.r2/(speed*w.sp) : t + w.r2*3;
    w.leak = leak;
    const sy = surfY(w.x,w.z); let y = sy, x = w.x, target = 0;
    if (leak) {
      const cyc = Math.max(0, (t - w.t0)*speed*w.sp) % 1;
      y = sy + .02 + cyc*2.2; x += Math.sin(cyc*7 + w.ph)*.12;
      target = cyc < .08 ? cyc/.08 : 1 - (cyc - .08)/.92;
    }
    w.a += (target - w.a)*.15;
    vPos[i*3] = x; vPos[i*3+1] = y; vPos[i*3+2] = w.z; vA[i] = w.a;
    if (leak && w.a > .05) nOut++;
  });
  firstVap = false;
  vGeo.attributes.position.needsUpdate = true; vGeo.attributes.aA.needsUpdate = true;
}

/* ---------- 标注 ---------- */
const LABELS = [
  ['角质层', [-W+.25, surfY(-W+.25,D)-.02, D]], ['表皮', [-W+.25, surfY(-W+.25,D)-.3, D]], ['真皮', [-W+.25, 2.1, D]], ['皮下脂肪', [-W+.25, -1.6, D]],
  ['毛囊', [fxY(1.7), 1.7, D]], ['皮脂腺', [fxY(2.85)+.5, 2.85, D]], ['汗腺', [SW.x+.2, SW.y, D]],
  ['毛细血管', [W, ejY(W, -.1)-.12, -.1]], ['动脉 / 静脉', [W, dbY(W,1.2)+.1, 1.2]],
].map(([t,p]) => { const el = document.createElement('div'); el.className = 'lbl'; el.innerHTML = `<span>${t}</span>`; document.body.appendChild(el); return {el, v:V(...p)}; });
const tmp = new THREE.Vector3();
function updLabels() {
  for (const L of LABELS) {
    tmp.copy(L.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    L.el.style.opacity = vis ? 1 : 0;
    L.el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth - 4}px, ${(-tmp.y*.5+.5)*innerHeight - 10}px)`;
  }
}

/* ---------- 状态切换 ---------- */
const cur = {...STATES[0].p}, goal = {...STATES[0].p};
let active = STATES[0], camTween = null;
const nav = document.getElementById('nav');
STATES.forEach(s => {
  const b = document.createElement('button');
  b.innerHTML = `<i></i>${s.name}${s.ready ? '' : ' <small>待做</small>'}`;
  if (!s.ready) b.disabled = true;
  b.onclick = () => select(s);
  s.btn = b; nav.appendChild(b);
});
const card = document.getElementById('card');
function fitCam(c) {
  const k = camera.aspect < 1 ? 1.7 : camera.aspect < 1.3 ? 1.25 : 1;
  const tg = V(...c.tgt), pos = V(...c.pos);
  return {pos: tg.clone().add(pos.sub(tg).multiplyScalar(k)), tgt: tg};
}
function select(s, instant) {
  active = s; Object.assign(goal, s.p);
  STATES.forEach(x => x.btn.classList.toggle('on', x === s));
  localStorage.setItem('hymnSkin.state', s.id);
  card.classList.add('fade');
  setTimeout(() => {
    document.getElementById('cName').textContent = s.name;
    document.getElementById('cSee').textContent = s.see;
    document.getElementById('cUnder').textContent = s.under;
    document.getElementById('cCare').textContent = s.care;
    card.classList.remove('fade');
  }, instant ? 0 : 280);
  const c = fitCam(s.cam);
  if (instant) { camera.position.copy(c.pos); controls.target.copy(c.tgt); camTween = null; }
  else camTween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:c.pos, t1:c.tgt};
}
controls.addEventListener('start', () => { camTween = null; controls.autoRotate = false; });
document.getElementById('bReset').onclick = () => select(active);
const bLabel = document.getElementById('bLabel');
const setLabel = on => { bLabel.classList.toggle('on', on); document.body.classList.toggle('nolabel', !on); localStorage.setItem('hymnSkin.label', on ? '1' : '0'); };
bLabel.onclick = () => setLabel(!bLabel.classList.contains('on'));
setLabel(localStorage.getItem('hymnSkin.label') !== '0');

const want = location.hash.slice(1) || localStorage.getItem('hymnSkin.state');
const saved = STATES.find(s => s.id === want && s.ready) || STATES[0];
Object.assign(cur, saved.p);
select(saved, true);
U.dry.value = cur.dry; updFlakes(cur.dry);

/* ---------- 循环 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
let lastMeter = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  let moved = false;
  for (const k in goal) { const d = goal[k] - cur[k]; if (Math.abs(d) > 1e-4) { cur[k] += d*Math.min(1, dt*1.6); moved = true; } }
  if (moved) { U.dry.value = cur.dry; updFlakes(cur.dry); }
  updVapor(t, cur);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt/1.8); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updLabels();
  if (t - lastMeter > .25) { lastMeter = t; document.getElementById('mOut').textContent = nOut; }
});
</script>
