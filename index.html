<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 · 皮肤 3D 课堂</title>
<style>
:root{--pink:#eaa8b1;--deep:#eaa8b1;--ink:#f4ece8;--mute:#a8948f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#120b0c}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.serif{font-family:"Songti SC","STSong","Noto Serif SC",serif}

header{position:fixed;left:32px;top:26px;pointer-events:none;z-index:2}
header .brand{letter-spacing:.34em;font-size:11px;color:var(--deep)}
header h1{font-size:30px;font-weight:600;margin-top:4px;letter-spacing:.06em}

nav{z-index:2;position:fixed;left:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 0;font-size:15px;color:var(--mute);transition:color .3s}
nav button i{width:16px;height:1px;background:currentColor;opacity:.5;transition:width .35s,background .35s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on i{width:34px;height:2px;background:var(--pink);opacity:1}
nav button[disabled]{cursor:default;opacity:.4}
nav button small{font-size:10px;letter-spacing:.1em}

.card{z-index:2;position:fixed;right:32px;bottom:32px;width:min(360px,calc(100vw - 64px));padding:22px 24px;background:rgba(32,19,20,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(234,168,177,.16);border-radius:18px;transition:opacity .35s}
.card.fade{opacity:0}
.card h2{font-size:26px;font-weight:600;letter-spacing:.04em}
.row{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:12px}
.row span{color:var(--deep);font-size:12px;letter-spacing:.08em;padding-top:2px}
.row p{font-size:15px;line-height:1.55}
.meter{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--mute);display:flex;gap:22px;align-items:flex-end}
.meter b{display:block;font-size:22px;line-height:1.2;color:#9fd0ff;font-variant-numeric:tabular-nums;font-weight:600}
.meter em{font-style:normal;margin-left:auto;display:flex;align-items:center;gap:6px}
.meter em::before{content:'';width:8px;height:8px;border-radius:50%;background:#9cc8ef}

.tools{z-index:2;position:fixed;right:32px;top:26px;display:flex;gap:8px}
.tools button{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:99px;background:transparent;border:1px solid rgba(234,168,177,.25);color:var(--mute);transition:all .3s}
.tools button.on,.tools button:hover{color:var(--ink);border-color:var(--pink)}

.foot{position:fixed;left:32px;bottom:22px;font-size:12px;color:#7a6663;pointer-events:none}

.lbl{z-index:1;position:fixed;left:0;top:0;pointer-events:none;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .3s;will-change:transform}
.lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--pink),0 0 8px rgba(234,168,177,.6);flex:none}
.lbl span{background:rgba(18,11,12,.66);padding:1px 9px;border-radius:99px;color:var(--ink)}
body.nolabel .lbl{opacity:0!important}

@media (max-width:820px){
  header{left:18px;top:16px} header h1{font-size:21px}
  nav{top:auto;bottom:0;left:0;right:0;transform:none;flex-direction:row;overflow-x:auto;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(15,9,10,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  nav button{white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:14px}
  nav button i{display:none}
  nav button.on{background:rgba(234,168,177,.2)}
  .card{left:14px;right:14px;width:auto;bottom:66px;padding:14px 16px}
  .card h2{font-size:20px} .row{margin-top:6px} .row p{font-size:14px}
  .meter{margin-top:10px;padding-top:8px}
  .foot{display:none}
  .tools{right:14px;top:16px}
}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 状态定义 ---------- */
const STATES = [
  {id:'healthy', name:'正常皮肤', ready:true,
   p:{dry:0, leak:.06},
   cam:{pos:[12,9.2,14.8], tgt:[0,1.2,0]},
   see:'饱满细腻，肤色均匀，有自然光泽，不干不油',
   under:'角质层薄而整齐，细胞间脂质把缝填满，水被锁在里面',
   care:'温和清洁、日常保湿、白天防晒，守住就好'},
  {id:'dry', name:'干燥缺水', ready:true,
   p:{dry:1, leak:.7},
   cam:{pos:[9.8,8.4,13.8], tgt:[1.3,2.3,1.2]},
   see:'紧绷、起皮、上妆卡粉，细纹更明显',
   under:'细胞间脂质变少，角质翘起、皮纹变深，水从表面加速跑掉',
   care:'补水的同时补脂质（如神经酰胺）；洗脸水别太烫，别过度清洁'},
  {id:'barrier', name:'屏障受损 · 敏感'},
  {id:'red', name:'泛红'},
  {id:'oily', name:'油性 · 毛孔粗大'},
  {id:'blackhead', name:'黑头'},
  {id:'acne', name:'闭口 → 痘痘'},
  {id:'mark', name:'痘印'},
  {id:'spot', name:'色斑 · 暗沉'},
  {id:'sunburn', name:'晒伤'},
  {id:'aging', name:'衰老 · 细纹'},
];

/* ---------- 基础 ---------- */
let seed = 11;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a,b) => a + (b-a)*rand();
const V = (x,y,z) => new THREE.Vector3(x,y,z);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .32;
{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
  const g = cv.getContext('2d');
  const lg = g.createLinearGradient(0,0,0,1024); lg.addColorStop(0,'#1c1213'); lg.addColorStop(1,'#0a0606');
  g.fillStyle = lg; g.fillRect(0,0,1024,1024);
  const rg = g.createRadialGradient(590,440,0,590,440,560); rg.addColorStop(0,'rgba(90,52,54,.55)'); rg.addColorStop(1,'rgba(90,52,54,0)');
  g.fillStyle = rg; g.fillRect(0,0,1024,1024);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(33, innerWidth/innerHeight, .1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = location.hash.includes("cam=hair") ? .1 : 5.5; controls.maxDistance = 40;
controls.autoRotate = true; controls.autoRotateSpeed = .3;

scene.add(new THREE.HemisphereLight(0xfff6f2, 0x8a6a66, .7));
const key = new THREE.DirectionalLight(0xfff0e4, 2.1); key.position.set(-4,10,8); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe6e0, .9); fill.position.set(9,3,6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd6dc, 1.6); rim.position.set(2,6,-10); scene.add(rim);

/* ---------- 尺寸与层界（JS 与着色器共用同一套公式） ---------- */
const W = 5, D = 4, TOP = 3.9, BOT = -1.3;
const surfY = (x,z) => TOP + .1*Math.sin(x*.8+.3)*Math.cos(z*.9-.5) + .05*Math.sin(x*1.9-z*1.3+1.);   // 皮肤表面起伏
const ridge = (x,z) => .08*(Math.sin(x*3.3+.4) + Math.sin(z*3.1-.2)) + .03*Math.sin(x*8.3-z*6.1+1.7)
  - .16*Math.pow(.5+.5*Math.sin(x*6.1+1.1+.7*Math.sin(x*2.3)), 6) - .12*Math.pow(.5+.5*Math.sin(z*5.7-.4+.7*Math.sin(z*1.9)), 6);   // 向下伸的表皮突，宽窄长短不一
const ejY = (x,z) => surfY(x,z) - .82 + ridge(x,z);     // 表皮/真皮交界
const dbY = (x,z) => .25 + .15*Math.sin(x*1.1+.3) + .12*Math.cos(z*1.3);       // 真皮/脂肪交界
const fxY = y => -2 + (y-.7)*.18;                                               // 切面上那根毛囊的中心线
const U = {dry:{value:0}, fol:{value:[]}, col:{value:null}, nrm:{value:null}};
{ // 照片级毛孔贴图（Human Materials 1, CC0）
  const ld = new THREE.TextureLoader();
  const set = t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  U.col.value = set(ld.load(window.SKIN_TEX.col)); U.col.value.colorSpace = THREE.SRGBColorSpace;
  U.nrm.value = set(ld.load(window.SKIN_TEX.nrm));
}

/* ---------- 皮肤块：程序化组织纹理 ---------- */
const NOISE = /* glsl */`
uniform float uDry;
uniform vec2 uFol[40];
varying vec3 vWPos; varying vec3 vWN;
float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
vec3 voro(vec3 p){vec3 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){vec3 g=vec3(x,y,z);vec3 r=g+h33(i+g)-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=h13(i+g+.5);}else if(d<d2)d2=d;}
 d1=sqrt(d1);d2=sqrt(d2);return vec3(d1,d2-d1,id);}
vec3 voro2(vec2 p){vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.,id=0.;
 for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++){vec2 g=vec2(x,y);vec2 r=g+h33(vec3(i+g,7.)).xy-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=h13(vec3(i+g,3.));}else if(d<d2)d2=d;}
 d1=sqrt(d1);d2=sqrt(d2);return vec3(d1,d2-d1,id);}
float surfY(vec2 q){return 3.9+.1*sin(q.x*.8+.3)*cos(q.y*.9-.5)+.05*sin(q.x*1.9-q.y*1.3+1.);}
/* 表面真实下凹：皮纹沟 + 毛孔（几何位移，边缘渐隐以免和切面错位） */
float topDisp(vec2 q,float d){
  vec3 v1=voro2(q*1.5); float cr1=1.-smoothstep(0.,.08+.03*d,v1.y);
  vec3 v2=voro2(q*4.2+3.1); float cr2=1.-smoothstep(0.,.05,v2.y);
  float pore=0., dmin=9.; for(int i=0;i<40;i++){float dd=length(q-uFol[i]); dmin=min(dmin,dd); pore=max(pore,1.-smoothstep(.035,.1,dd));}
  float fade=smoothstep(0.,.18,min(5.-abs(q.x),4.-abs(q.y)));
  float full=-cr1*(.035+.03*d)-cr2*(.01+.008*d)-pore*.04+fbm(vec3(q*1.6,9.))*.04;
  float near=1.-smoothstep(.07,.2,dmin);          // 毛发周围只留毛孔凹陷，不让皮纹/起伏挡住毛根
  return fade*mix(full,-pore*.04,near);
}
`;
const GLSL = /* glsl */`
uniform sampler2D uCol; uniform sampler2D uNrm;
const float TEXS=2.4;   // 贴图每 2.4 个单位重复一次
vec3 L(vec3 c){return pow(c,vec3(2.2));}
float ejY(vec2 q){float x=q.x,z=q.y;
  float r=.08*(sin(x*3.3+.4)+sin(z*3.1-.2))+.03*sin(x*8.3-z*6.1+1.7)
    -.16*pow(.5+.5*sin(x*6.1+1.1+.7*sin(x*2.3)),6.)-.12*pow(.5+.5*sin(z*5.7-.4+.7*sin(z*1.9)),6.);
  return surfY(q)-.82+r;}
float dbY(vec2 q){return .25+.15*sin(q.x*1.1+.3)+.12*cos(q.y*1.3);}
float segD(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}

/* 表面：皮纹、毛孔、干燥时翘起的皮屑 */
void topSkin(vec3 p,out vec3 c,out float H,out float r,out float s){
  vec2 q=p.xz; float d=uDry;
  vec2 w=q+(vec2(fbm(vec3(q*.7,1.)),fbm(vec3(q*.7,5.)))-.5)*.9;      // 打散，避免规整多边形
  vec3 v1=voro2(w*1.25); float g1=1.-smoothstep(0.,.16+.06*d,v1.y); g1*=g1;
  vec3 v2=voro2(w*3.4+3.1); float g2=1.-smoothstep(0.,.12,v2.y); g2*=g2;
  float grain=fbm(vec3(q*26.,2.)), n2=fbm(vec3(q*.9,4.)), mot=fbm(vec3(q*2.3,8.));
  float pore=0.;
  for(int i=0;i<40;i++){pore=max(pore,1.-smoothstep(.03,.085,length(q-uFol[i])));}
  vec3 vp=voro2(q*2.2+11.); pore=max(pore,step(.62,vp.z)*(1.-smoothstep(.0,.028,vp.x))*.75);
  H=-g1*(.011+.031*d)-g2*(.003+.01*d)-pore*(.015+.012*d)+(grain-.5)*(.0025+.002*d);
  vec3 base=mix(L(vec3(.88,.70,.58)),L(vec3(.84,.64,.53)),smoothstep(.3,.7,n2));
  base=mix(base,L(vec3(.86,.60,.52)),smoothstep(.55,.75,mot)*(.15+.25*d));
  base=mix(base,L(vec3(.74,.56,.45)),smoothstep(.6,.8,fbm(vec3(q*4.,12.)))*(.06+.14*d));
  vec3 tc=texture(uCol,q/TEXS).rgb, tavg=textureLod(uCol,vec2(.5),12.).rgb;
  float tl=dot(tc,vec3(.3,.55,.15))/max(dot(tavg,vec3(.3,.55,.15)),.01);
  base*=mix(1.,tl,.45+.35*d);   // 只借照片的明暗细节，底色保持米桃色
  base=mix(base,base*vec3(.82,.74,.72),(g1*.5+g2*.2)*(.45+.55*d));
  base=mix(base,L(vec3(.50,.36,.30)),pore*.55);
  float edge=smoothstep(.06,.16,v1.y)*(1.-smoothstep(.16,.3,v1.y));
  float speck=smoothstep(.62,.72,fbm(vec3(q*9.,3.)));
  vec3 dc=mix(base,base*vec3(.92,.9,.9)+L(vec3(.05,.045,.04)),.6);
  dc=mix(dc,L(vec3(.93,.87,.81)),edge*.45+speck*.35);
  H+=d*(edge*.006+speck*.004);
  c=mix(base,dc,d);
  r=mix(.3+g1*.1,.82,d); s=1.;
}
/* 切面：角质层 / 表皮 / 真皮 / 皮下脂肪 */
void cutFace(vec3 p,vec3 nw,out vec3 c,out float H,out float r,out float s){
  vec2 q=p.xz; float d=uDry;
  float ej=ejY(q), db=dbY(q)+(fbm(p*1.3)-.5)*.35;
  float sy=surfY(q); float scT=sy-(.08+.08*d);
  H=0.; r=.55; s=0.;
  if(p.y>scT){
    float lam=sin(p.y*110.+fbm(p*10.)*4.)*.5+.5;
    c=mix(L(vec3(.92,.76,.64)),L(vec3(.85,.68,.57)),lam*.35);
    vec3 vc=voro(vec3(p.x*3.,p.y*20.,p.z*3.));
    float crack=d*(1.-smoothstep(0.,.04,vc.y))*.6;
    c=mix(c,L(vec3(.70,.56,.50)),crack*.7);
    H=lam*.003-crack*.012; r=mix(.45,.8,d); s=.5;
  } else if(p.y>ej){
    float t=clamp((p.y-ej)/(scT-ej),0.,1.);
    vec2 eu=abs(nw.z)>.5?p.xy:p.zy;
    vec3 v=voro2(eu*vec2(10.,13.));
    float aa=1.-smoothstep(.05,.2,fwidth(eu.y)*9.);
    vec3 cc=mix(L(vec3(.80,.46,.40)),L(vec3(.86,.58,.48)),t);
    cc*=.93+.1*v.z;
    cc=mix(cc,L(vec3(.92,.74,.66)),(1.-smoothstep(0.,.1,v.y))*.4*aa);
    cc=mix(cc,L(vec3(.60,.38,.42)),(1.-smoothstep(.12,.2,v.x))*.35*(1.-t*.8)*aa);
    float basal=1.-smoothstep(.0,.07,p.y-ej);
    cc=mix(cc,L(vec3(.58,.37,.28)),basal*.6*(.6+.4*v.z));
    c=mix(cc,cc*.97+.02,d*.5);
    H=((1.-v.x)*.003+(1.-smoothstep(0.,.1,v.y))*.0015)*aa; r=.5; s=1.;
  } else if(p.y>db){
    float pap=smoothstep(ej-.75,ej-.4,p.y);
    vec2 du=abs(nw.z)>.5?p.xy:p.zy;
    vec2 wq=du+(vec2(fbm(vec3(du*.8,3.)),fbm(vec3(du*.8,6.)))-.5)*.8;
    float n1=fbm(vec3(wq.x*1.6,wq.y*7.,1.));
    float n2=fbm(vec3(wq.x*1.0+wq.y*.7,wq.y*7.,4.));               // 第二组束，走向略斜，和第一组交织
    float b1=smoothstep(.42,.62,n1), b2=smoothstep(.47,.66,n2);
    float bundle=max(b1,b2*.85);
    float sf=fwidth(wq.y)*26.;
    float fib=mix(.5,fbm(vec3(wq.x*2.2,wq.y*26.,2.)),1.-smoothstep(.25,.7,sf));   // 束内细纤维，远看自动淡出
    vec3 ret=mix(L(vec3(.86,.57,.54)),L(vec3(.95,.76,.71)),bundle);
    ret*=mix(1.,.92+.16*fib,bundle);
    float f2=fbm(vec3(du*9.,4.)); float thin=1.-smoothstep(0.,.06,abs(f2-.5));
    vec3 papC=mix(L(vec3(.90,.60,.56)),L(vec3(.97,.80,.75)),thin*.8);
    c=mix(ret,papC,pap);
    float el=1.-smoothstep(0.,.018,abs(fbm(vec3(wq.x*2.,wq.y*5.,7.))-.5));
    c=mix(c,L(vec3(.95,.82,.55)),el*.45*(1.-pap));
    H=bundle*.01*(1.-pap)+thin*.003*pap; r=.55; s=.6;
  } else {

    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), nerveMat); m.scale.set(.045, .1, .03); m.position.copy(P); scene.add(m);
    for (let k=-2; k<=2; k++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.04, .006, 6, 16), new THREE.MeshStandardMaterial({color:'#c9a96a', roughness:.5})); r.rotation.x = Math.PI/2; r.scale.set(1, .7, 1); r.position.copy(P); r.position.y += k*.035; scene.add(r); }
    nerve(f, h + .5, dbY(...faceXZ(f,h)) + .2, h, y - .1);
    return P;
  };
  NERVE.meis = meis('f', 3.05); meis('f', -3.95); meis('r', 1.55);
  // 环层小体：同心层，切面像洋葱
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  let rr = 124;
  for (let i=0; rr > 8; i++) {       // 层片厚薄不均、略有起伏
    g.beginPath();
    for (let a=0; a<=64; a++) { const t = a/64*Math.PI*2, w = rr*(1 + .04*Math.sin(t*3+i) + .03*Math.sin(t*5-i*2)); const x = 128+Math.cos(t)*w, y = 128+Math.sin(t)*w; a ? g.lineTo(x,y) : g.moveTo(x,y); }
    g.fillStyle = i%2 ? '#efe0c2' : '#dcc39a'; g.fill();
    rr -= 4 + rand()*9;
  }
  g.beginPath(); g.ellipse(128,128,10,7,0,0,Math.PI*2); g.fillStyle = '#b08848'; g.fill();
  const onion = new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv), roughness:.45}); onion.map.colorSpace = THREE.SRGBColorSpace;
  const pac = (f, h) => {
    const [x,z] = faceXZ(f,h), y = (BOT + dbY(x,z))/2 + .1;
    const m = new THREE.Mesh(new THREE.CircleGeometry(.15, 40), onion); m.scale.set(1.7, 1, 1); m.rotateZ(R(-.3,.3)); m.position.copy(onFace(f, h, y, -.004));
    const sg = (f === 'f' || f === 'r') ? 1 : -1; m.rotation.y = alongX(f) ? (sg > 0 ? 0 : Math.PI) : sg*Math.PI/2; scene.add(m);
    nerve(f, h - .7, dbY(x,z) + .35, h - .3, y + .02);
    return m.position.clone();
  };
  NERVE.pac = pac('f', 2.3); pac('r', -2.4);
  nerve('f', -.6, dbY(-.6,D)+.15, -.2, ejY(-.2,D)-.3);
  nerve('b', 1.2, dbY(1.2,-D)+.15, 1.6, ejY(1.6,-D)-.3);
  nerve('l', -.8, dbY(-W,-.8)+.15, -.4, ejY(-W,-.4)-.3);
}

/* 底部柔影 */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(.55,'rgba(0,0,0,.2)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0,0,128,128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(17,14), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.y = BOT - .02; scene.add(m);
}

/* ---------- 干燥：翘起的皮屑 ---------- */
const flakeGeo = new THREE.CircleGeometry(.5, 14, 0, Math.PI*2); flakeGeo.scale(1,.75,1); flakeGeo.rotateX(-Math.PI/2);
{ const p = flakeGeo.attributes.position; for (let i=0; i<p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, .28*x*x + .12*z*z); } flakeGeo.computeVertexNormals(); }
const flakes = [];
for (let i=0; i<380; i++) flakes.push({x:R(-W+.3,W-.3), z:R(-D+.3,D-.3), s:R(.05,.13), ry:R(0,6.28), tilt:R(.08,.45), lift:R(0,.05)});
const flakeMesh = new THREE.InstancedMesh(flakeGeo, new THREE.MeshPhysicalMaterial({color:'#e2c6b4', roughness:.8, side:THREE.DoubleSide, transparent:true, opacity:.85, sheen:.6, sheenColor:new THREE.Color('#fff4ee')}), flakes.length);
flakeMesh.frustumCulled = false; scene.add(flakeMesh);
const dummy = new THREE.Object3D();
function updFlakes(d) {
  flakes.forEach((f,i) => {
    const s = f.s * Math.min(1, d*1.3);
    dummy.position.set(f.x, surfY(f.x,f.z) + .004 + f.lift*d, f.z); dummy.rotation.set(f.tilt*d, f.ry, 0); dummy.scale.set(s, s, s*.8);
    dummy.updateMatrix(); flakeMesh.setMatrixAt(i, dummy.matrix);
  });
  flakeMesh.instanceMatrix.needsUpdate = true; flakeMesh.visible = d > .01;
}

/* ---------- 水汽：从表面往外跑 ---------- */
const NV = 320, vap = [], vPos = new Float32Array(NV*3), vA = new Float32Array(NV), vS = new Float32Array(NV);
for (let i=0; i<NV; i++) { vap.push({x:R(-W+.3,W-.3), z:R(-D+.3,D-.3), r:rand(), r2:rand(), ph:R(0,6), sp:R(.7,1.3), leak:false, t0:0, a:0}); vS[i] = R(.05,.09); }
const vGeo = new THREE.BufferGeometry();
vGeo.setAttribute('position', new THREE.BufferAttribute(vPos,3));
vGeo.setAttribute('aA', new THREE.BufferAttribute(vA,1));
vGeo.setAttribute('aS', new THREE.BufferAttribute(vS,1));
scene.add(Object.assign(new THREE.Points(vGeo, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{uPR:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float aA; attribute float aS; uniform float uPR; varying float vA;
    void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aS*uPR*900./-mv.z; gl_Position=projectionMatrix*mv; vA=aA; }`,
  fragmentShader:`varying float vA; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.1,d)*vA; if(a<.01) discard; gl_FragColor=vec4(.62,.82,1.,a*.7); }`
})), {frustumCulled:false}));
let nOut = 0, firstVap = true;
function updVapor(t, p) {
  const speed = .12 + .1*p.dry; nOut = 0;
  vap.forEach((w,i) => {
    const leak = w.r < p.leak;
    if (leak && !w.leak) w.t0 = firstVap ? t - w.r2/(speed*w.sp) : t + w.r2*3;
    w.leak = leak;
    const sy = surfY(w.x,w.z); let y = sy, x = w.x, target = 0;
    if (leak) {
      const cyc = Math.max(0, (t - w.t0)*speed*w.sp) % 1;
      y = sy + .02 + cyc*2.2; x += Math.sin(cyc*7 + w.ph)*.12;
      target = cyc < .08 ? cyc/.08 : 1 - (cyc - .08)/.92;
    }
    w.a += (target - w.a)*.15;
    vPos[i*3] = x; vPos[i*3+1] = y; vPos[i*3+2] = w.z; vA[i] = w.a;
    if (leak && w.a > .05) nOut++;
  });
  firstVap = false;
  vGeo.attributes.position.needsUpdate = true; vGeo.attributes.aA.needsUpdate = true;
}

/* ---------- 标注 ---------- */
const LABELS = [
  ['角质层', [-W+.25, surfY(-W+.25,D)-.04, D]], ['表皮', [-W+.25, surfY(-W+.25,D)-.45, D]], ['真皮', [-W+.25, 1.5, D]], ['皮下脂肪', [-W+.25, -.6, D]],
  ['毛囊', [fxY(2.0), 2.0, D]], ['皮脂腺', [fxY(2.55)+.95, 2.45, D]], ['汗腺', [SW.x+.45, SW.y, D]],
  ['毛细血管', [.2, ejY(.2, D)-.2, D]], ['动脉 / 静脉', [-3.4, dbY(-3.4,D)+.12, D]],
  ['触觉小体', NERVE.meis.toArray()], ['环层小体（压觉）', NERVE.pac.toArray()],
].map(([t,p]) => { const el = document.createElement('div'); el.className = 'lbl'; el.innerHTML = `<span>${t}</span>`; document.body.appendChild(el); return {el, v:V(...p)}; });
const tmp = new THREE.Vector3();
function updLabels() {
  for (const L of LABELS) {
    tmp.copy(L.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    L.el.style.opacity = vis ? 1 : 0;
    L.el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth - 4}px, ${(-tmp.y*.5+.5)*innerHeight - 10}px)`;
  }
}

/* ---------- 状态切换 ---------- */
const cur = {...STATES[0].p}, goal = {...STATES[0].p};
let active = STATES[0], camTween = null;
const nav = document.getElementById('nav');
STATES.forEach(s => {
  const b = document.createElement('button');
  b.innerHTML = `<i></i>${s.name}${s.ready ? '' : ' <small>待做</small>'}`;
  if (!s.ready) b.disabled = true;
  b.onclick = () => select(s);
  s.btn = b; nav.appendChild(b);
});
const card = document.getElementById('card');
function fitCam(c) {
  const k = camera.aspect < 1 ? 1.7 : camera.aspect < 1.3 ? 1.25 : 1;
  const tg = V(...c.tgt), pos = V(...c.pos);
  return {pos: tg.clone().add(pos.sub(tg).multiplyScalar(k)), tgt: tg};
}
function select(s, instant) {
  active = s; Object.assign(goal, s.p);
  STATES.forEach(x => x.btn.classList.toggle('on', x === s));
  localStorage.setItem('hymnSkin.state', s.id);
  document.querySelector('.meter').style.display = s.p.leak > .2 ? '' : 'none';
  card.classList.add('fade');
  setTimeout(() => {
    document.getElementById('cName').textContent = s.name;
    document.getElementById('cSee').textContent = s.see;
    document.getElementById('cUnder').textContent = s.under;
    document.getElementById('cCare').textContent = s.care;
    card.classList.remove('fade');
  }, instant ? 0 : 280);
  const c = fitCam(s.cam);
  if (instant) { camera.position.copy(c.pos); controls.target.copy(c.tgt); camTween = null; }
  else camTween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:c.pos, t1:c.tgt};
}
controls.addEventListener('start', () => { camTween = null; controls.autoRotate = false; });
document.getElementById('bReset').onclick = () => select(active);
const bLabel = document.getElementById('bLabel');
const setLabel = on => { bLabel.classList.toggle('on', on); document.body.classList.toggle('nolabel', !on); localStorage.setItem('hymnSkin.label', on ? '1' : '0'); };
bLabel.onclick = () => setLabel(!bLabel.classList.contains('on'));
setLabel(localStorage.getItem('hymnSkin.label') !== '0');

const [hashState, hashCam] = location.hash.slice(1).split('&cam=');   // 调试用：#healthy&cam=x,y,z,tx,ty,tz
const want = hashState || localStorage.getItem('hymnSkin.state');
const saved = STATES.find(s => s.id === want && s.ready) || STATES[0];
Object.assign(cur, saved.p);
select(saved, true);
U.dry.value = cur.dry; updFlakes(cur.dry);
if (hashCam && hashCam.startsWith('hair')) { const f = fol[+hashCam.slice(4)||0], y = surfY(f.x,f.y); camera.position.set(f.x+.35, y+.3, f.y+.45); controls.target.set(f.x, y, f.y); controls.autoRotate = false; }
else if (hashCam) { const c = hashCam.split(',').map(Number); camera.position.set(c[0],c[1],c[2]); controls.target.set(c[3],c[4],c[5]); controls.autoRotate = false; }

/* ---------- 循环 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
let lastMeter = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  let moved = false;
  for (const k in goal) { const d = goal[k] - cur[k]; if (Math.abs(d) > 1e-4) { cur[k] += d*Math.min(1, dt*1.6); moved = true; } }
  if (moved) { U.dry.value = cur.dry; updFlakes(cur.dry); }
  updVapor(t, cur);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt/1.8); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updLabels();
  if (t - lastMeter > .25) { lastMeter = t; document.getElementById('mOut').textContent = nOut; }
});
</script>
