<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 · 皮肤 3D 课堂</title>
<style>
:root{--pink:#eaa8b1;--deep:#c46f7d;--ink:#3b2a2b;--mute:#9a8584}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#f3e6e3}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.serif{font-family:"Songti SC","STSong","Noto Serif SC",serif}

header{position:fixed;left:32px;top:26px;pointer-events:none;z-index:2}
header .brand{letter-spacing:.34em;font-size:11px;color:var(--deep)}
header h1{font-size:30px;font-weight:600;margin-top:4px;letter-spacing:.06em}

nav{z-index:2;position:fixed;left:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 0;font-size:15px;color:var(--mute);transition:color .3s}
nav button i{width:16px;height:1px;background:currentColor;opacity:.5;transition:width .35s,background .35s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on i{width:34px;height:2px;background:var(--pink);opacity:1}
nav button[disabled]{cursor:default;opacity:.4}
nav button small{font-size:10px;letter-spacing:.1em}

.card{z-index:2;position:fixed;right:32px;bottom:32px;width:min(360px,calc(100vw - 64px));padding:22px 24px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 50px -20px rgba(150,80,90,.35);border-radius:18px;transition:opacity .35s}
.card.fade{opacity:0}
.card h2{font-size:26px;font-weight:600;letter-spacing:.04em}
.row{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:12px}
.row span{color:var(--deep);font-size:12px;letter-spacing:.08em;padding-top:2px}
.row p{font-size:15px;line-height:1.55}
.meter{margin-top:16px;padding-top:12px;border-top:1px solid rgba(160,110,115,.15);font-size:12px;color:var(--mute);display:flex;gap:22px;align-items:flex-end}
.meter b{display:block;font-size:22px;line-height:1.2;color:#3d8fd6;font-variant-numeric:tabular-nums;font-weight:600}
.meter .out b{color:#d36a6a}
.meter em{font-style:normal;margin-left:auto;display:flex;align-items:center;gap:6px}
.meter em::before{content:'';width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fd2ff 60%,#5aa8e8);box-shadow:0 0 0 1px rgba(90,168,232,.3)}

.tools{z-index:2;position:fixed;right:32px;top:26px;display:flex;gap:8px}
.tools button{all:unset;cursor:pointer;font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);color:var(--mute);transition:all .3s}
.tools button.on,.tools button:hover{color:var(--ink);border-color:var(--pink)}

.foot{position:fixed;left:32px;bottom:22px;font-size:12px;color:#a8908e;pointer-events:none}

.lbl{z-index:1;position:fixed;left:0;top:0;pointer-events:none;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .3s;will-change:transform}
.lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--pink);flex:none}
.lbl span{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:1px 9px;border-radius:99px;color:var(--ink)}
body.nolabel .lbl{opacity:0!important}

@media (max-width:820px){
  header{left:18px;top:16px} header h1{font-size:21px}
  nav{top:auto;bottom:0;left:0;right:0;transform:none;flex-direction:row;overflow-x:auto;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  nav button{white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:14px}
  nav button i{display:none}
  nav button.on{background:rgba(234,168,177,.35)}
  .card{left:14px;right:14px;width:auto;bottom:66px;padding:14px 16px}
  .card h2{font-size:20px} .row{margin-top:6px} .row p{font-size:14px}
  .meter{margin-top:10px;padding-top:8px}
  .foot{display:none}
  .tools{right:14px;top:16px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header><div class="brand">HYMN · 赫眉</div><h1 class="serif">皮肤里面长什么样</h1></header>
<nav id="nav"></nav>
<div class="tools"><button id="bLabel" class="on">标注</button><button id="bReset">复位</button></div>
<div class="card" id="card">
  <h2 class="serif" id="cName"></h2>
  <div class="row"><span>看得到</span><p id="cSee"></p></div>
  <div class="row"><span>底下</span><p id="cUnder"></p></div>
  <div class="row"><span>护理</span><p id="cCare"></p></div>
  <div class="meter"><div>留在皮肤里<b id="mIn">0</b></div><div class="out">正往外跑<b id="mOut">0</b></div><em>水分子（示意）</em></div>
</div>
<div class="foot">示意图：各层厚度做了放大，不是真实比例 · 拖动旋转，双指缩放</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries, mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- 状态定义 ---------- */
const STATES = [
  {id:'healthy', name:'健康肌', ready:true,
   p:{dry:0, water:.94, lipid:1},
   cam:{pos:[14,9.5,17.5], tgt:[0,.3,0]},
   see:'有光泽，摸着软，不紧绷',
   under:'角质细胞像砖，细胞间脂质像水泥，砌得严严实实，把水锁在里面',
   care:'温和清洁、日常保湿、白天防晒，守住就好'},
  {id:'dry', name:'干燥缺水', ready:true,
   p:{dry:1, water:.38, lipid:.15},
   cam:{pos:[11.5,9.6,15.5], tgt:[1.4,2.1,1]},
   see:'紧绷、起皮、上妆卡粉，细纹更明显',
   under:'“水泥”变少，砖翘起来、缝变大，水顺着缝往外跑',
   care:'补水的同时补“水泥”（如神经酰胺）；洗脸水别太烫，别过度清洁'},
  {id:'barrier', name:'屏障受损 · 敏感'},
  {id:'red', name:'泛红'},
  {id:'oily', name:'油性 · 毛孔粗大'},
  {id:'blackhead', name:'黑头'},
  {id:'acne', name:'闭口 → 痘痘'},
  {id:'mark', name:'痘印'},
  {id:'spot', name:'色斑 · 暗沉'},
  {id:'sunburn', name:'晒伤'},
  {id:'aging', name:'衰老 · 细纹'},
];

/* ---------- 基础 ---------- */
let seed = 7;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a,b) => a + (b-a)*rand();
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .03).texture;
scene.environmentIntensity = 1.0;

/* 背景：柔粉白 + 虚化光斑（画在纹理里，透明材质才能折射到它） */
{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
  const g = cv.getContext('2d');
  const lg = g.createLinearGradient(0,0,0,1024); lg.addColorStop(0,'#fbf3f1'); lg.addColorStop(.6,'#f5e5e2'); lg.addColorStop(1,'#ecd5d1');
  g.fillStyle = lg; g.fillRect(0,0,1024,1024);
  const glow = (x,y,r,c) => { const rg = g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,c); rg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(x-r,y-r,2*r,2*r); };
  glow(600,420,520,'rgba(255,255,255,.9)');
  glow(880,160,260,'rgba(240,190,196,.45)');
  glow(120,860,320,'rgba(236,180,186,.4)');
  for (let i=0; i<26; i++) glow(R(0,1024), R(0,1024), R(14,60), `rgba(255,255,255,${R(.25,.6).toFixed(2)})`);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, .1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 4; controls.maxDistance = 40;
controls.autoRotate = true; controls.autoRotateSpeed = .35;

scene.add(new THREE.HemisphereLight(0xffffff, 0xf0d0cc, .9));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(5,12,9); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe0e4, 1.6); rim.position.set(-9,5,-8); scene.add(rim);

/* ---------- 形状：整体轻微起伏 + 表皮突 ---------- */
const W = 5, D = 4;
const wave = (x,z) => .16*Math.sin(x*.6+.5)*Math.cos(z*.7-.2);
const ridge = (x,z) => .18*Math.sin(x*1.7+.4)*Math.cos(z*1.5-.3);
const ej = (x,z) => 2.55 + wave(x,z) + ridge(x,z);
const FOL = [{x:2.2, z:1.0, bot:-.9}, {x:-2.7, z:-1.9, bot:-.5}];
const nearF = (x,z,r) => FOL.some(f => Math.hypot(x-f.x, z-f.z) < r);
const dummy = new THREE.Object3D();
const col = new THREE.Color();

/* 圆角软垫：上下两面按函数起伏 */
function slab(bottom, top, h, r = .3, inset = 0) {
  const w = W - inset, d = D - inset;
  let g = new THREE.BoxGeometry(2*w, h, 2*d, 110, 14, 88);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position, v = V(), q = V();
  const rr = Math.min(r, h*.45);
  for (let i=0; i<p.count; i++) {
    v.fromBufferAttribute(p, i);
    q.set(clamp(v.x, -w+rr, w-rr), clamp(v.y, -h/2+rr, h/2-rr), clamp(v.z, -d+rr, d-rr));
    const dv = v.clone().sub(q);
    if (dv.lengthSq() > 1e-10) v.copy(q).addScaledVector(dv.normalize(), rr);
    const t = (v.y + h/2)/h, b = bottom(v.x,v.z), tp = top(v.x,v.z);
    p.setXYZ(i, v.x, b + t*(tp-b), v.z);
  }
  g.computeVertexNormals();
  return g;
}

/* ---------- 材质 ---------- */
const jelly = (o) => new THREE.MeshPhysicalMaterial({roughness:.12, metalness:0, transmission:1, thickness:1, ior:1.4, clearcoat:1, clearcoatRoughness:.08, specularIntensity:1, ...o});
const gloss = (o) => new THREE.MeshPhysicalMaterial({roughness:.3, metalness:0, clearcoat:.8, clearcoatRoughness:.15, sheen:.6, sheenColor:new THREE.Color('#fff0f0'), ...o});

/* ---------- 角质层：一片片“砖” ---------- */
const bricks = [];
for (let row=0; row<4; row++) {
  for (let x=-W+.45; x<=W-.45; x+=.74) for (let zi=0, z=-D+.45; z<=D-.45; z+=.64, zi++) {
    const xx = clamp(x + (zi%2 ? .37 : 0) + (row%2 ? .22 : 0) + R(-.05,.05), -W+.42, W-.42);
    const zz = clamp(z + (row%2 ? .28 : 0) + R(-.05,.05), -D+.42, D-.42);
    if (nearF(xx,zz,.45)) continue;
    bricks.push({x:xx, y:3.67 + row*.09 + wave(xx,zz) + R(-.01,.01), z:zz, row, ry:R(0,Math.PI), ta:R(0,Math.PI*2), r1:rand(), r2:rand(), r3:rand(),
      base:new THREE.Color().setHSL(.02+R(-.01,.01), .62, row===3 ? .86 : .82+R(-.02,.02))});
  }
}
const brickMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 28, 10), gloss({roughness:.28}), bricks.length);
brickMesh.frustumCulled = false; scene.add(brickMesh);
const dullCol = new THREE.Color('#d9cbc6');
function updBricks(p) {
  bricks.forEach((b,i) => {
    const top = b.row === 3, d = p.dry;
    const s = 1 - .26*d*(.6 + .4*b.r1);
    const curl = d*(top ? .26 : b.row===2 ? .1 : .03)*b.r2;
    let rx = Math.cos(b.ta)*curl, rz = Math.sin(b.ta)*curl, y = b.y + (top ? d*.04*b.r2 : 0);
    if (top && b.r3 < .08) { y += d*(.08 + .22*b.r1); rx += Math.cos(b.ta)*d*.4; rz += Math.sin(b.ta)*d*.4; }
    dummy.position.set(b.x, y, b.z); dummy.rotation.set(rx, b.ry, rz);
    dummy.scale.set(.47*s, .055*(1 - .2*d), .42*s);
    dummy.updateMatrix(); brickMesh.setMatrixAt(i, dummy.matrix);
    col.copy(b.base).lerp(dullCol, d*(top ? .6 : .3)); brickMesh.setColorAt(i, col);
  });
  brickMesh.instanceMatrix.needsUpdate = true; brickMesh.instanceColor.needsUpdate = true;
}
/* 砖缝里的“水泥”：细胞间脂质，像一层奶霜 */
const lipidMat = gloss({color:'#fff3e4', roughness:.18, clearcoat:1, transparent:true, opacity:1, sheen:0});
const lipid = new THREE.Mesh(slab((x,z) => 3.6 + wave(x,z), (x,z) => 3.9 + wave(x,z), .3, .12, .15), lipidMat);
scene.add(lipid);

/* ---------- 活表皮：果冻细胞 ---------- */
const cells = [];
for (let x=-W+.32; x<=W-.32; x+=.5) for (let z=-D+.32; z<=D-.32; z+=.5) {
  const xx = x + R(-.06,.06), zz = z + R(-.06,.06);
  if (nearF(xx,zz,.48)) continue;
  const base = ej(xx,zz), topY = 3.42 + wave(xx,zz); let layer = 0;
  for (let y=base+.2; y<topY; y+=.4, layer++) {
    const basal = layer === 0, gran = y > topY - .3;
    const melano = basal && rand() < .035;
    cells.push({x:xx, y, z:zz, sx: gran ? 1.25 : 1, sy: basal ? 1.15 : gran ? .62 : .92, ry:R(0,6), melano,
      c: basal ? new THREE.Color().setHSL(.985,.65,.72) : gran ? new THREE.Color().setHSL(.03,.7,.86) : new THREE.Color().setHSL(.995,.7,.8+R(-.03,.03))});
  }
}
const cellGeo = new THREE.SphereGeometry(.26, 22, 16);
const cellList = cells.filter(c => !c.melano), melList = cells.filter(c => c.melano);
const cellMesh = new THREE.InstancedMesh(cellGeo, jelly({thickness:.5, attenuationColor:new THREE.Color('#f39aa2'), attenuationDistance:.8, roughness:.08}), cellList.length);
cellMesh.frustumCulled = false; scene.add(cellMesh);
cellList.forEach((c,i) => cellMesh.setColorAt(i, c.c));
const melMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(.17, 18, 12), gloss({color:'#8a4f36', roughness:.25}), melList.length);
melList.forEach((c,i) => { dummy.position.set(c.x,c.y,c.z); dummy.rotation.set(0,0,0); dummy.scale.set(1,1.1,1); dummy.updateMatrix(); melMesh.setMatrixAt(i, dummy.matrix); });
scene.add(melMesh);
function updCells(p) {
  const k = 1 - .14*p.dry;
  cellList.forEach((c,i) => {
    dummy.position.set(c.x, c.y, c.z); dummy.rotation.set(0, c.ry, 0); dummy.scale.set(c.sx*k, c.sy*k, c.sx*k);
    dummy.updateMatrix(); cellMesh.setMatrixAt(i, dummy.matrix);
    col.copy(c.c).lerp(dullCol, .45*p.dry); cellMesh.setColorAt(i, col);
  });
  cellMesh.instanceMatrix.needsUpdate = true; cellMesh.instanceColor.needsUpdate = true;
}

/* ---------- 真皮：粉色果冻层，里面是胶原、弹力纤维、血管 ---------- */
const DB = (x,z) => -1.45 + wave(x,z)*.6;
scene.add(new THREE.Mesh(slab(DB, (x,z) => ej(x,z) - .02, 4, .35),
  jelly({color:'#ffd9d6', thickness:2.5, attenuationColor:new THREE.Color('#f4a2a4'), attenuationDistance:4.5, roughness:.18, ior:1.38})));

function fiber(n, yMin, yMax, r0, r1, amp, len) {
  const geos = [];
  for (let i=0; i<n; i++) {
    const a = R(0,Math.PI*2), dir = V(Math.cos(a), R(-.1,.1), Math.sin(a));
    const perp = V(-dir.z, 0, dir.x), st = V(R(-W,W), R(yMin,yMax), R(-D,D));
    const pts = [], L = R(len*.6, len), ph = R(0,6);
    for (let k=0; k<=8; k++) {
      const p = st.clone().addScaledVector(dir, L*k/8).addScaledVector(perp, Math.sin(k*1.3+ph)*amp);
      p.x = clamp(p.x, -W+.35, W-.35); p.z = clamp(p.z, -D+.35, D-.35);
      p.y += Math.cos(k*1.7+ph)*amp*.6 + wave(p.x,p.z);
      p.y = clamp(p.y, DB(p.x,p.z) + .3, ej(p.x,p.z) - .15);
      for (const f of FOL) { const dx=p.x-f.x, dz=p.z-f.z, d=Math.hypot(dx,dz); if (d<.5) { p.x = f.x+dx/d*.5; p.z = f.z+dz/d*.5; } }
      pts.push(p);
    }
    geos.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, R(r0,r1), 6));
  }
  return mergeGeometries(geos);
}
scene.add(new THREE.Mesh(fiber(170, -1.1, 1.6, .04, .065, .22, 4), gloss({color:'#fbe6df', roughness:.25})));
scene.add(new THREE.Mesh(fiber(90, 1.6, 2.6, .02, .03, .14, 2.4), gloss({color:'#fde9e3', roughness:.25})));
scene.add(new THREE.Mesh(fiber(55, -1.1, 2.4, .014, .02, .35, 3.2), gloss({color:'#f0c46a', roughness:.2, emissive:'#5a3a00', emissiveIntensity:.25})));

const vessels = [];
for (let x=-4.4; x<=4.4; x+=.9) for (let z=-3.4; z<=3.4; z+=.9) {
  const xx = x + R(-.2,.2), zz = z + R(-.2,.2), top = ej(xx,zz), lo = 1.3 + wave(xx,zz);
  if (top - wave(xx,zz) < 2.6 || nearF(xx,zz,.6)) continue;
  const w = .07;
  vessels.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(xx-w,lo,zz), V(xx-w*.8,top-.28,zz), V(xx,top-.14,zz), V(xx+w*.8,top-.28,zz), V(xx+w,lo,zz)]), 20, .035, 6));
}
for (const yy of [1.3, -.9]) for (let i=0; i<6; i++) {
  const z0 = R(-D+.8,D-.8), pts = [];
  for (let k=0; k<=8; k++) { const x = -W+.4 + k*(2*W-.8)/8; pts.push(V(x, yy + wave(x,z0) + R(-.2,.2), z0 + Math.sin(k*1.4+i)*.5)); }
  vessels.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, yy > 0 ? .045 : .07, 8));
}
scene.add(new THREE.Mesh(mergeGeometries(vessels), gloss({color:'#e0414f', roughness:.18, clearcoat:1, sheen:0})));

/* ---------- 皮下脂肪：琥珀色果冻泡 ---------- */
const fats = [];
for (let x=-W+.5; x<=W-.5; x+=.92) for (let z=-D+.5; z<=D-.5; z+=.92) for (let y=-3.7; y<=-1.95; y+=.82)
  fats.push({x:x+R(-.1,.1), y:y+R(-.08,.08)+wave(x,z), z:z+R(-.1,.1), r:R(.42,.5)});
const fatMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1,26,18), jelly({color:'#fff1d8', thickness:.9, attenuationColor:new THREE.Color('#f6cf94'), attenuationDistance:2.2, roughness:.1}), fats.length);
fats.forEach((f,i) => { dummy.position.set(f.x,f.y,f.z); dummy.rotation.set(0,0,0); dummy.scale.set(f.r, f.r*.9, f.r); dummy.updateMatrix(); fatMesh.setMatrixAt(i, dummy.matrix); });
scene.add(fatMesh);

/* ---------- 毛囊、皮脂腺、汗腺 ---------- */
const folMat = gloss({color:'#eaa5a2', roughness:.25, side:THREE.DoubleSide});
const hairMat = gloss({color:'#3a2620', roughness:.2, sheen:0});
const glandMat = jelly({color:'#ffe3a8', thickness:.5, attenuationColor:new THREE.Color('#eab04a'), attenuationDistance:.6});
for (const f of FOL) {
  const prof = [[.05,f.bot-.25],[.2,f.bot-.2],[.38,f.bot],[.36,f.bot+.3],[.27,f.bot+.9],[.26,1],[.27,3],[.31,3.95]].map(([r,y]) => new THREE.Vector2(r,y));
  const fm = new THREE.Mesh(new THREE.LatheGeometry(prof, 32), folMat); fm.position.set(f.x,wave(f.x,f.z),f.z); scene.add(fm);
  const top = 5.4, hl = top - (f.bot-.1);
  const hair = new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,hl,12), hairMat); hair.position.set(f.x, (top+f.bot-.1)/2 + wave(f.x,f.z), f.z); scene.add(hair);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.33,.06,10,32), folMat); ring.rotation.x = Math.PI/2; ring.position.set(f.x,3.95+wave(f.x,f.z),f.z); scene.add(ring);
  const g = new THREE.Group(); g.position.set(f.x+.52, 1.9+wave(f.x,f.z), f.z);
  for (let i=0; i<7; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(R(.2,.28),20,14), glandMat); s.position.set(R(-.12,.25), R(-.3,.3), R(-.25,.25)); g.add(s); }
  scene.add(g);
}
{
  const c = V(-.6,-1.0,2.4), pts = [];
  for (let k=0; k<=60; k++) { const a = k/60*Math.PI*7; pts.push(V(c.x+Math.cos(a)*.3, c.y-.2+k/60*.4, c.z+Math.sin(a)*.3)); }
  for (let k=1; k<=14; k++) { const t = k/14, y = c.y+.2 + t*(3.95-c.y-.2); pts.push(V(c.x + (y>2.6 ? Math.cos(y*9)*.08 : Math.sin(k)*.05), y + wave(c.x,c.z)*t, c.z + (y>2.6 ? Math.sin(y*9)*.08 : 0))); }
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 220, .06, 8), gloss({color:'#f3c8bd', roughness:.22})));
}

/* 底部柔影 */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(150,80,85,.32)'); gr.addColorStop(.55,'rgba(150,80,85,.12)'); gr.addColorStop(1,'rgba(150,80,85,0)'); g.fillStyle = gr; g.fillRect(0,0,128,128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(17,14), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false, toneMapped:false}));
  m.rotation.x = -Math.PI/2; m.position.y = -4.35; scene.add(m);
}

/* ---------- 水分子：晶莹水珠 ---------- */
const NW = 260, drops = [];
for (let i=0; i<NW; i++) {
  const x = R(-W+.5, W-.5), z = R(-D+.5, D-.5), inSC = rand() < .4;
  const y = inSC ? R(3.66,3.92) + wave(x,z) : R(ej(x,z)+.15, 3.4 + wave(x,z));
  drops.push({x, y, z, r:rand(), r2:rand(), ph:R(0,6), sp:R(.7,1.3), sz:R(.09,.15), leak:false, t0:0, a:0});
}
const dropMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshPhysicalMaterial({color:'#f2faff', roughness:0, transmission:1, thickness:.25, ior:1.33, clearcoat:1, clearcoatRoughness:0, attenuationColor:new THREE.Color('#9fd2ff'), attenuationDistance:.35, specularIntensity:1, envMapIntensity:1.6}), NW);
dropMesh.frustumCulled = false; scene.add(dropMesh);
let nIn = 0, nOut = 0, firstWater = true;
function updWater(t, p) {
  const leakFrac = 1 - p.water, speed = .05 + .1*p.dry;
  nIn = 0; nOut = 0;
  drops.forEach((w,i) => {
    const leak = w.r < leakFrac;
    // 错开起跑：首次载入随机相位；切换状态时最多延迟 3 秒才开始往外跑
    if (leak && !w.leak) w.t0 = firstWater ? t - w.r2/(speed*w.sp) : t + w.r2*3;
    w.leak = leak;
    let x = w.x, y = w.y, z = w.z, target;
    if (!leak) {
      x += Math.sin(t*1.3+w.ph)*.02; y += Math.cos(t*1.1+w.ph)*.015; target = 1;
    } else {
      const cyc = Math.max(0, (t - w.t0)*speed*w.sp) % 1;
      if (cyc < .6) {
        const k = cyc/.6, surf = 4 + wave(w.x,w.z); y = w.y + k*(5.8 - w.y); x += Math.sin(k*9+w.ph)*.08;
        target = y < surf ? 1 : Math.max(0, 1 - (y-surf)/1.6);
      } else target = 0;
    }
    w.a += (target - w.a)*.12;
    const s = w.sz * w.a;
    dummy.position.set(x, y, z); dummy.rotation.set(0,0,0); dummy.scale.set(s, s, s);
    dummy.updateMatrix(); dropMesh.setMatrixAt(i, dummy.matrix);
    if (!leak) { if (w.a > .3) nIn++; } else if (w.a > .05) nOut++;
  });
  firstWater = false;
  dropMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- 标注 ---------- */
const LABELS = [
  ['角质层', [-W,3.85,D]], ['表皮', [-W,3.0,D]], ['真皮', [-W,.6,D]], ['皮下脂肪', [-W,-2.8,D]],
  ['毛囊', [FOL[0].x+.3,.2,FOL[0].z]], ['皮脂腺', [FOL[0].x+.6,1.9,FOL[0].z]], ['汗腺', [-.3,-1.0,2.4]], ['毛细血管', [-W+.4,1.35,1.5]],
].map(([t,p]) => { const el = document.createElement('div'); el.className = 'lbl'; el.innerHTML = `<span>${t}</span>`; document.body.appendChild(el); return {el, v:V(...p)}; });
const tmp = new THREE.Vector3();
function updLabels() {
  for (const L of LABELS) {
    tmp.copy(L.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    L.el.style.opacity = vis ? 1 : 0;
    L.el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth - 4}px, ${(-tmp.y*.5+.5)*innerHeight - 10}px)`;
  }
}

/* ---------- 状态切换 ---------- */
const cur = {...STATES[0].p}, goal = {...STATES[0].p};
let active = STATES[0], camTween = null;
const nav = document.getElementById('nav');
STATES.forEach(s => {
  const b = document.createElement('button');
  b.innerHTML = `<i></i>${s.name}${s.ready ? '' : ' <small>待做</small>'}`;
  if (!s.ready) b.disabled = true;
  b.onclick = () => select(s);
  s.btn = b; nav.appendChild(b);
});
const card = document.getElementById('card');
function fitCam(c) {
  const k = camera.aspect < 1 ? 1.7 : camera.aspect < 1.3 ? 1.25 : 1;
  const tg = V(...c.tgt), pos = V(...c.pos);
  return {pos: tg.clone().add(pos.sub(tg).multiplyScalar(k)), tgt: tg};
}
function select(s, instant) {
  active = s; Object.assign(goal, s.p);
  STATES.forEach(x => x.btn.classList.toggle('on', x === s));
  localStorage.setItem('hymnSkin.state', s.id);
  card.classList.add('fade');
  setTimeout(() => {
    document.getElementById('cName').textContent = s.name;
    document.getElementById('cSee').textContent = s.see;
    document.getElementById('cUnder').textContent = s.under;
    document.getElementById('cCare').textContent = s.care;
    card.classList.remove('fade');
  }, instant ? 0 : 280);
  const c = fitCam(s.cam);
  if (instant) { camera.position.copy(c.pos); controls.target.copy(c.tgt); camTween = null; }
  else camTween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:c.pos, t1:c.tgt};
}
controls.addEventListener('start', () => { camTween = null; controls.autoRotate = false; });
document.getElementById('bReset').onclick = () => select(active);
const bLabel = document.getElementById('bLabel');
const setLabel = on => { bLabel.classList.toggle('on', on); document.body.classList.toggle('nolabel', !on); localStorage.setItem('hymnSkin.label', on ? '1' : '0'); };
bLabel.onclick = () => setLabel(!bLabel.classList.contains('on'));
setLabel(localStorage.getItem('hymnSkin.label') !== '0');

const want = location.hash.slice(1) || localStorage.getItem('hymnSkin.state');
const saved = STATES.find(s => s.id === want && s.ready) || STATES[0];
Object.assign(cur, saved.p);
select(saved, true);
const applyLipid = p => { lipidMat.opacity = .15 + .85*p.lipid; lipid.scale.y = .35 + .65*p.lipid; lipid.position.y = (1 - lipid.scale.y)*3.75; };
updBricks(cur); updCells(cur); applyLipid(cur);

/* ---------- 循环 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
let lastMeter = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  let moved = false;
  for (const k in goal) { const d = goal[k] - cur[k]; if (Math.abs(d) > 1e-4) { cur[k] += d*Math.min(1, dt*1.8); moved = true; } }
  if (moved) { updBricks(cur); updCells(cur); applyLipid(cur); }
  updWater(t, cur);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt/1.8); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updLabels();
  if (t - lastMeter > .25) { lastMeter = t; document.getElementById('mIn').textContent = nIn; document.getElementById('mOut').textContent = nOut; }
});
</script>
